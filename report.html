<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>AI 经营报告 · 日报周报月报</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #F2F3F5;
    color: #1A1D26;
    font-size: 13px;
    line-height: 1.5;
    overflow: hidden;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  .hdr {
    flex: none; background: #fff; padding: 10px 14px 0;
    border-bottom: .5px solid #E8E9EC; position: relative; z-index: 20;
  }
  .hdr-row { display: flex; align-items: center; height: 34px; }
  .back { width: 28px; font-size: 20px; color: #1A1D26; display: flex; align-items: center; }
  .hdr-title { flex: 1; font-size: 17px; font-weight: 600; text-align: center; margin-right: -28px; }
  .role-chip {
    display: flex; align-items: center; gap: 4px; font-size: 12px; color: #0B62D6;
    background: #EAF2FE; border-radius: 12px; padding: 4px 9px;
  }
  .tabs { display: flex; gap: 8px; padding: 10px 0 10px; }
  .tab {
    flex: none; padding: 6px 16px; border-radius: 9px; background: #F2F3F5;
    color: #4B5563; font-size: 13px; font-weight: 500;
  }
  .tab.on { background: #EAF2FE; color: #0B62D6; font-weight: 600; }
  .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 96px; }
  .date-bar { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px; }
  .date-btn { font-size: 12px; color: #0B62D6; background: #EAF2FE; border-radius: 8px; padding: 5px 12px; }
  .date-btn.off { color: #B6BCC6; background: #F2F3F5; }
  .date-cur { font-size: 13px; color: #374151; font-weight: 500; }
  .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card-hd { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .card-title { font-size: 15px; font-weight: 600; color: #111827; }
  .card-sub { font-size: 11px; color: #9CA3AF; }
  .muted { color: #6B7280; font-size: 12px; }
  .tiny { color: #9CA3AF; font-size: 11px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 10px; font-size: 13px; font-weight: 500; padding: 9px 14px;
    background: #EAF2FE; color: #0B62D6; border: 0;
  }
  .btn.ghost { background: #F4F5F7; color: #4B5563; }
  .btn.main {
    background: linear-gradient(96deg, #7055DB 0%, #4665E6 100%); color: #fff;
    box-shadow: 0 4px 12px rgba(70,101,230,.22);
  }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .btn:active { opacity: .82; }
  .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; flex: none; line-height: 16px; }
  .t-red { background: #FDECEC; color: #C0392B; }
  .t-amber { background: #FEF3E2; color: #B26A00; }
  .t-green { background: #E8F7EE; color: #17803D; }
  .t-blue { background: #EAF2FE; color: #0B62D6; }
  .t-gray { background: #F3F4F6; color: #6B7280; }
  .alert {
    background: #FFF1F0; border: .5px solid #FAD4D0; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .alert-hd { display: flex; align-items: center; gap: 6px; }
  .alert-hd b { font-size: 13.5px; color: #B42318; font-weight: 600; }
  .alert-groups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ag { display: flex; align-items: center; gap: 4px; background: #fff; border-radius: 8px; padding: 4px 8px; font-size: 11.5px; color: #4B5563; border: .5px solid #F5D9D5; }
  .ag b { color: #B42318; font-weight: 600; }
  .mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #EDEEF1; border-radius: 10px; overflow: hidden; }
  .mcell { background: #FAFBFC; padding: 9px 10px; }
  .mcell .k { font-size: 10.5px; color: #8A919E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mcell .v { font-size: 17px; font-weight: 600; letter-spacing: -.2px; margin-top: 1px; }
  .mcell .d { font-size: 10.5px; margin-top: 1px; }
  .neg { color: #D92D20; } .pos { color: #17803D; } .warn { color: #B26A00; } .neutral { color: #6B7280; }
  .grp { border: .5px solid #ECEDF0; border-radius: 11px; margin-bottom: 8px; overflow: hidden; background: #fff; }
  .grp-hd { display: flex; align-items: center; gap: 6px; padding: 10px 11px; background: #FAFBFC; }
  .grp-hd .nm { font-size: 12.5px; font-weight: 600; }
  .grp-hd .cnt { font-size: 11px; color: #8A919E; }
  .grp-hd .arw { margin-left: auto; font-size: 11px; color: #9CA3AF; transition: transform .18s; }
  .grp.open .arw { transform: rotate(90deg); }
  .grp-bd { display: none; padding: 2px 11px 6px; }
  .grp.open .grp-bd { display: block; }
  .item { padding: 9px 0 9px 10px; border-left: 2.5px solid #E5E7EB; margin: 6px 0; }
  .item.risk { border-left-color: #E5484D; }
  .item.amber { border-left-color: #F5A524; }
  .item.ok { border-left-color: #16A34A; }
  .item-t { font-size: 12.5px; color: #1F2430; line-height: 1.45; }
  .item-m { font-size: 11px; color: #9CA3AF; margin-top: 2px; }
  .item-a { display: flex; gap: 6px; margin-top: 7px; }
  .pill { font-size: 11px; border-radius: 7px; padding: 3px 9px; border: .5px solid #DCE0E6; color: #4B5563; background: #fff; }
  .pill.act { border-color: #0B62D6; color: #0B62D6; background: #EAF2FE; }
  .pill.done { color: #17803D; border-color: #BBE5C8; background: #E8F7EE; }
  .seg3 { display: flex; align-items: center; gap: 6px; }
  .kv { display: flex; font-size: 12px; padding: 3px 0; }
  .kv .k { color: #8A919E; width: 74px; flex: none; }
  .bar { height: 6px; border-radius: 3px; background: #EFEFF2; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg,#7055DB,#4665E6); transition: width .3s; }
  .todo { display: flex; gap: 10px; padding: 10px 0; border-bottom: .5px solid #F1F2F4; align-items: flex-start; }
  .todo:last-child { border-bottom: 0; }
  .ck {
    width: 20px; height: 20px; border-radius: 50%; border: 1.6px solid #C7CCD4;
    flex: none; margin-top: 1px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; transition: all .2s; background: #fff;
  }
  .ck.on { background: #16A34A; border-color: #16A34A; }
  .todo.done .tt { color: #A0A6B1; text-decoration: line-through; }
  .tt { font-size: 13px; color: #1F2430; }
  .tm { font-size: 11px; color: #9CA3AF; margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .foot {
    position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.97);
    border-top: .5px solid #E8E9EC; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; z-index: 30;
  }
  .foot .btn { flex: 1; padding: 11px 8px; }
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(8px);
    background: rgba(26,29,38,.92); color: #fff; font-size: 12.5px; padding: 9px 16px;
    border-radius: 10px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; max-width: 84%;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .sheet-mask { position: fixed; inset: 0; background: rgba(17,20,26,.42); z-index: 50; display: none; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h4 { margin: 0 0 4px; font-size: 15px; }
  .opt { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: .5px solid #F1F2F4; font-size: 13px; }
  .rolemenu { position: absolute; right: 12px; top: 46px; background: #fff; border-radius: 12px; box-shadow: 0 8px 28px rgba(17,20,26,.16); padding: 6px; display: none; z-index: 40; width: 132px; }
  .rolemenu.on { display: block; }
  .rolemenu div { padding: 8px 10px; border-radius: 8px; font-size: 12.5px; color: #374151; }
  .rolemenu div.on { background: #EAF2FE; color: #0B62D6; font-weight: 600; }
  .sp-sec { margin-top: 8px; }
  .sp-sec .h { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .sp-sec .t { font-size: 12.5px; color: #374151; margin-top: 3px; line-height: 1.65; }
  .sp-src { font-size: 10px; color: #8A919E; background: #F4F5F7; border-radius: 4px; padding: 1px 5px; font-weight: 400; }
  .empty { text-align: center; color: #9CA3AF; font-size: 12px; padding: 14px 0; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .plan { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: .5px solid #F1F2F4; }
  .plan:last-child { border-bottom: 0; }

  /* 桌面浏览器打开时，与 App 外壳（600px 居中）完全对齐，避免被拉伸成宽屏 */
  @media (min-width: 601px) {
    body { background: #DEE7F1; }
    #app {
      width: 600px; max-width: 600px; margin: 0 auto;
      background: #F2F3F5; position: relative;
    }
    .foot { left: 50%; right: auto; width: 600px; transform: translateX(-50%); }
    .sheet { left: 50%; right: auto; width: 600px; transform: translateX(-50%); }
    .toast { max-width: 520px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-row">
      <div class="back" id="back">‹</div>
      <div class="hdr-title">经营报告</div>
      <div class="role-chip" id="roleChip"><span id="roleName">网格长</span><span style="font-size:9px">▾</span></div>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab on" data-p="day">日报</div>
      <div class="tab" data-p="week">周报</div>
      <div class="tab" data-p="month">月报</div>
    </div>
    <div class="rolemenu" id="roleMenu">
      <div data-r="网格长" class="on">网格长视图</div>
      <div data-r="网格经理">网格经理视图</div>
    </div>
  </div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast"></div>
<div class="sheet-mask" id="mask"><div class="sheet" id="sheet"></div></div>

<script>

    } catch(e){}
    return '网格长';
  }
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(LS_MINE) || '{}'); } catch(e){ saved = {}; }

  var S = {
    role: saved.role || readRole(),

    openGroups: {},
    confirmed: {},

    todos: null,
    plan: null,
    planDeleted: {}

      '<div class="tiny" style="margin-bottom:2px">按计划日期与截止时间排序，历史积压不计入今日分母</div>' +
      S.todos.map(function(t){
        var tags = t.tag ? '<span class="tag ' + (t.tag === '重点' ? 't-red' : 't-amber') + '">' + t.tag + '</span>' : '';
        return '<div class="todo' + (t.done ? ' done' : '') + '" data-todo="' + t.id + '">' +
          '<div class="ck' + (t.done ? ' on' : '') + '">' + (t.done ? '✓' : '') + '</div>' +
          '<div class="grow"><div class="tt">' + esc(t.t) + ' ' + tags + '</div>' +
          '<div class="tm"><span>' + esc(t.meta) + '</span></div></div>' +
          '<span class="tag ' + (t.done ? 't-green' : 't-gray') + '">' + (t.done ? '已完成' : '待处理') + '</span></div>';
      }).join('') +
      '<div style="margin-top:8px"><button class="btn ghost" style="width:100%" data-act="feedback">提交反馈 / 补充说明</button></div></div>';
  }

  function gapCard(){
    var rows = [
      { k: '客户接触', v: 25, a: 1, b: 4 },
      { k: '有效完成任务', v: 33, a: 1, b: 3 },
      { k: '业务已开通', v: 50, a: 1, b: 2 }
    ];
    return '<div class="card"><div class="card-hd"><div class="card-title">个人指标与目标差距</div>' +
      '<span class="card-sub" style="margin-left:auto">时间进度 70%</span></div>' +
      rows.map(function(r){
        return '<div style="margin-top:10px"><div class="row"><span style="font-size:12.5px">' + r.k + '</span>' +
          '<span style="margin-left:auto;font-size:12.5px;color:#D92D20;font-weight:600">' + r.v + '%</span></div>' +
          '<div class="bar" style="margin-top:5px"><i style="width:' + r.v + '%"></i></div>' +
          '<div class="tiny" style="margin-top:4px">已完成 ' + r.a + ' / 目标 ' + r.b + ' · 差距 ' + (r.b - r.a) + ' · 落后时间进度超过 10 个百分点</div></div>';
      }).join('') + '</div>';
  }

  function planCard(){
    var alive = S.plan.filter(function(p){ return !p.gone; });
    return '<div class="card" style="border:1px solid #CFEBDA"><div class="card-hd">' +
      '<div class="card-title">AI 明日计划</div>' +
      '<span class="card-sub" style="margin-left:auto">未完成 3 + 新增 2</span></div>' +
      '<div class="tiny" style="margin-bottom:2px">依据今日未完成事项、网格长晨会指派与 AI 推荐生成，可逐条调整</div>' +
      (alive.length ? alive.map(function(p){
        return '<div class="plan"><span class="tag ' + (p.tag === '新增' ? 't-green' : 't-blue') + '">' + p.tag + '</span>' +
          '<div class="grow"><div style="font-size:12.5px">' + esc(p.t) + '</div><div class="tiny">' + esc(p.meta) + '</div></div>' +
          '<span class="pill" data-plan-edit="' + p.i + '">调整</span>' +
          '<span class="pill" data-plan-del="' + p.i + '">删除</span></div>';
      }).join('') : '<div class="empty">计划已清空，可重新生成</div>') +
      '<div class="row" style="margin-top:10px;gap:8px">' +
      '<button class="btn sm ghost" data-act="planRegen">重新生成</button>' +
      '<button class="btn sm ghost" data-act="planAdd">手动添加</button>' +
      '<button class="btn sm" style="margin-left:auto" data-act="planSave">保存计划</button></div></div>';
  }

  function confirmCard(){
    return '<div class="card" style="background:#FFFBF2;border:1px solid #F6E3BF"><div class="card-hd">' +
      '<div class="card-title" style="color:#8A5A00">提交前确认（2 项）</div></div>' +
      '<div style="font-size:12px;color:#6B5316;line-height:1.7;margin-top:2px">' +
      '① 李老板客户已拜访，但未检出订单或商机，请选择结果：<br>' +
      '<span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' +
      ['已完成未转化', '客户拒绝', '下次跟进', '补充说明'].map(function(x){
        return '<span class="pill" data-choice="' + x + '">' + x + '</span>';
      }).join('') + '</span>' +
      '<div style="margin-top:8px">② 今日有无特殊事项需要上报？<span class="pill" style="margin-left:6px" data-choice="无特殊事项">无</span>' +
      '<span class="pill" style="margin-left:6px" data-choice="填写说明">有，填写说明</span></div></div></div>';
  }

  function render(){
    $('roleName').textContent = S.role;
    $('roleMenu').querySelectorAll('div').forEach(function(d){
      d.classList.toggle('on', d.getAttribute('data-r') === S.role);
    });
    Array.prototype.forEach.call($('tabs').children, function(t){
      t.classList.toggle('on', t.getAttribute('data-p') === S.period);
    });

    var html = '<div class="date-bar"><span class="date-btn off">‹ 上一期</span>' +
      '<span class="date-cur">' + dateText() + '</span><span class="date-btn">下一期 ›</span></div>';
    html += headCard();
    if (S.role === '网格长') {
      html += alertBar();
      html += metricCard();
      html += anomalyCard();
      html += speechCard();
      html += leaderExtra();
    } else {
      html += progressCard();
      html += todoCard();
      html += gapCard();
      html += planCard();
      html += confirmCard();
      html += anomalyCard();
    }
    $('body').innerHTML = html;
    $('body').scrollTop = 0;

    $('foot').innerHTML = S.role === '网格长'
      ? '<button class="btn ghost" data-act="toTask">一键转任务</button>' +
        '<button class="btn main" data-act="export">导出晨会简报</button>'
      : '<button class="btn ghost" data-act="draft">保存草稿</button>' +
        '<button class="btn main" data-act="submit">确认并一键提交日报</button>';
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-p],[data-r],[data-g],[data-confirm],[data-task],[data-evidence],[data-todo],[data-choice],[data-plan-del],[data-plan-edit],[data-act],[data-jump]');
    if (!el) return;

    if (el.hasAttribute('data-p')) { S.period = el.getAttribute('data-p'); S.confirmed = {}; render(); return; }
    if (el.hasAttribute('data-r')) {
      S.role = el.getAttribute('data-r');
      $('roleMenu').classList.remove('on');
      save(); render(); toast('已切换为' + S.role + '视图'); return;
    }
    if (el.hasAttribute('data-g')) {
      var gid = el.getAttribute('data-g');
      var cur = S.openGroups[gid] !== undefined ? S.openGroups[gid] : (GROUPS[S.period].filter(function(g){ return g.id === gid; })[0].lvl === 'ok');
      S.openGroups[gid] = !cur;
      el.classList.toggle('open', !cur);
      return;
    }
    if (el.hasAttribute('data-jump')) {
      var jid = el.getAttribute('data-jump');
      var target = document.querySelector('[data-g="' + jid + '"]');
      if (target) { S.openGroups[jid] = true; target.classList.add('open'); target.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      return;
    }
    if (el.hasAttribute('data-confirm')) {
      var k = el.getAttribute('data-confirm');
      S.confirmed[k] = !S.confirmed[k];
      el.classList.toggle('done', !!S.confirmed[k]);
      el.textContent = S.confirmed[k] ? '已确认' : '确认';
      if (S.confirmed[k]) toast('已确认，将纳入发言框架');
      updateCounts();
      return;
    }
    if (el.hasAttribute('data-task')) { toast('已转为明日任务，可在「我的待办」查看'); return; }
    if (el.hasAttribute('data-evidence')) { toast('依据：指标明细 + 数据快照（演示）'); return; }
    if (el.hasAttribute('data-todo')) {
      var tid = parseInt(el.getAttribute('data-todo'), 10);
      var td = S.todos.filter(function(t){ return t.id === tid; })[0];
      td.done = !td.done;
      save(); render();
      toast(td.done ? '已完成 1 项，进度与日报同步更新' : '已取消完成，进度已回退');
      return;
    }
    if (el.hasAttribute('data-choice')) { el.classList.toggle('act'); toast('已选择：' + el.getAttribute('data-choice')); return; }
    if (el.hasAttribute('data-plan-del')) {
      var pi = parseInt(el.getAttribute('data-plan-del'), 10);
      S.plan.forEach(function(p){ if (p.i === pi) p.gone = true; });
      save(); render(); toast('已删除该条计划'); return;
    }
    if (el.hasAttribute('data-plan-edit')) { toast('可调整执行时间与责任人（演示）'); return; }

    var act = el.getAttribute('data-act');
    if (act === 'regen') { S.generated = true; save(); render(); toast('已按当前数据重新生成报告'); return; }
    if (act === 'evidence') { toast('已打开数据依据：指标快照 / 业务明细（演示）'); return; }
    if (act === 'speech') { S.generated = true; save(); render(); toast('已按当前报告生成发言框架（3 段）'); return; }
    if (act === 'editSpeech') { toast('发言框架进入编辑模式（演示）'); return; }
    if (act === 'copy') { toast('发言稿已复制到剪贴板'); return; }
    if (act === 'toTask') { toast('已将 3 项异常转为今日任务'); return; }
    if (act === 'export') { toast('晨会简报已导出（演示）'); return; }
    if (act === 'feedback') { toast('已打开反馈填写：结果 / 说明 / 下一步'); return; }
    if (act === 'planRegen') { S.plan.forEach(function(p){ p.gone = false; }); save(); render(); toast('已重新生成明日计划'); return; }
    if (act === 'planAdd') { toast('可手动添加一条明日计划（演示）'); return; }
    if (act === 'planSave') { toast('明日计划已保存，明早自动转为待办'); return; }
    if (act === 'draft') { toast('已保存草稿'); return; }
    if (act === 'submit') {
      var left = S.todos.filter(function(t){ return !t.done; }).length;
      toast('日报已提交，剩 ' + left + ' 项未完成已顺延至明日');
      return;
    }
  });

  function updateCounts(){
    var total = GROUPS[S.period].reduce(function(a,g){ return a + g.items.length; }, 0);
    var done = Object.keys(S.confirmed).filter(function(k){ return S.confirmed[k]; }).length;
    var el = document.querySelector('.card-hd .card-sub');
    var hs = document.querySelectorAll('.card-hd .card-sub');
    for (var i = 0; i < hs.length; i++) {
      if (hs[i].textContent.indexOf('已确认') === 0) hs[i].textContent = '已确认 ' + done + '/' + total;
    }
  }

  $('roleChip').addEventListener('click', function(e){
    e.stopPropagation();
    $('roleMenu').classList.toggle('on');
  });
  document.addEventListener('click', function(e){
    if (!e.target.closest('#roleChip') && !e.target.closest('#roleMenu')) $('roleMenu').classList.remove('on');
  });
  $('back').addEventListener('click', function(){
    if (window.parent !== window) { window.parent.postMessage({ type: 'closeReport' }, '*'); }
    else if (history.length > 1) history.back();
  });

  render();
})();
</script>
</body>
</html>
