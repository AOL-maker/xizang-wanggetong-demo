<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>组织画像</title>
  <style>
    :root{--blue:#2e7cf6;--ink:#1d2430;--text:#3c4654;--muted:#8a939e;--line:#eef1f5;--radius:16px}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#f5f7fa}
    button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0;text-align:left}
    .app{width:min(600px,100%);min-height:100vh;margin:0 auto;background:#f5f7fa;padding-bottom:20px}
    .hero{background:linear-gradient(165deg,#dcecfc 0%,#e8f3fe 58%,#eef5fe 100%);padding-bottom:18px}
    .topbar{height:56px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 8px}
    .back{width:48px;height:44px;font-size:26px;color:#3c4654;display:grid;place-items:center;margin-left:4px}
    .title{text-align:center;font-size:19px;font-weight:600}
    .org-card{margin:6px 14px 0;background:#fff;border-radius:var(--radius);padding:16px 14px;display:grid;grid-template-columns:1fr 46px;gap:8px;box-shadow:0 6px 18px rgba(26,110,240,.08)}
    .org-head{display:flex;gap:12px;align-items:flex-start;min-width:0}
    .avatar{width:46px;height:46px;border-radius:14px;flex:0 0 auto;background:radial-gradient(circle at 35% 30%,#7db6f9,#2e7cf6 70%);display:grid;place-items:center}
    .avatar svg{width:26px;height:26px}
    .org-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
    .org-name{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;line-height:1.3}
    .org-name .chip{flex:0 0 auto;font-size:11px;font-weight:500;color:#2e7cf6;background:#e7f1fe;border-radius:5px;padding:2px 7px}
    .grid-line{font-size:12.5px;color:#55606d}
    .tags{display:flex;flex-wrap:wrap;gap:8px}
    .tags span{background:#f0f4f9;border-radius:6px;padding:4px 10px;font-size:11.5px;color:#4a5563}
    .guardian{font-size:13px;color:#4a5563}
    .guardian a{color:var(--blue);text-decoration:none}
    .guardian .sep{color:#c6d2e2;margin:0 4px}
    .call{width:42px;height:42px;border-radius:50%;background:var(--blue);display:grid;place-items:center;align-self:start;margin-top:6px;box-shadow:0 4px 10px rgba(46,124,246,.35);transition:transform .15s}
    .call:active{transform:scale(.92)}
    .call svg{width:20px;height:20px}
    .body{padding:14px;display:flex;flex-direction:column;gap:14px}
    .card{background:#fff;border-radius:var(--radius);padding:16px 14px}
    .stats{background:#f7f9fb;border-radius:12px;padding:14px 6px;display:grid;grid-template-columns:repeat(3,1fr)}
    .stats>div{text-align:center}
    .stats b{font-size:22px;font-weight:800;letter-spacing:-.3px}
    .stats b.txt{font-size:16px;font-weight:700;letter-spacing:0}
    .stats small{font-size:11px;color:#8a939e;margin-left:3px}
    .stats span{display:block;margin-top:5px;font-size:12.5px;color:#6b7480}
    .card-title{font-size:16px;font-weight:700;margin-bottom:12px}
    .basic-rows{display:flex;flex-direction:column;gap:13px}
    .basic-rows .row{display:grid;grid-template-columns:110px 1fr;align-items:start;font-size:13.5px;line-height:1.5}
    .basic-rows .k{color:#2b3440;font-weight:600}
    .basic-rows .v{color:#4a5563;word-break:break-all}
    .badge{display:inline-block;background:#dcebfc;color:#3a7bd5;border-radius:6px;padding:3px 9px;font-size:12px}
    .bar-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin-bottom:13px}
    .bar-title:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--blue)}
    .bar-title .cnt{font-size:12.5px;font-weight:500;color:#8a939e}
    .mem-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .mem-chips button{font-size:12.5px;color:#5b6472;background:#f2f5f9;border-radius:14px;padding:5px 13px;min-height:0}
    .mem-chips button.on{color:#1361ff;background:#e7f1fe;font-weight:600}
    .mem-list{display:flex;flex-direction:column;gap:10px}
    .mem{display:flex;align-items:center;gap:11px;background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:11px 12px;width:100%}
    .mem:active{background:#f0f5fb}
    .mem-av{flex:0 0 38px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;
      background:linear-gradient(150deg,#6aa9f7,#2e7cf6)}
    .mem-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
    .mem-name{font-size:14.5px;font-weight:600;color:#232b36;display:flex;align-items:center;gap:6px}
    .mem-role{font-style:normal;font-size:11px;font-weight:500;color:#7a8694;background:#eef2f7;border-radius:4px;padding:1px 6px}
    .mem-sub{font-size:12px;color:#8a939e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mem-tag{flex:0 0 auto;font-size:11.5px;color:#3a7bd5;background:#eaf3fe;border-radius:5px;padding:3px 8px;white-space:nowrap}
    .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
    .svc-grid button{min-height:38px;border-radius:9px;background:#eff4fa;color:#3c4654;font-size:13px;display:grid;place-items:center;text-align:center}
    .svc-grid button:active{background:#e2ebf5}
    .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:rgba(25,31,40,.9);color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:10;white-space:nowrap;max-width:88vw}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:520px){.title{font-size:17.5px}.org-card{margin:4px 10px 0}.org-name{font-size:17px}.stats b{font-size:19px}.stats span{font-size:11px}
      .basic-rows .row{grid-template-columns:96px 1fr;font-size:12.5px}.mem-name{font-size:13.5px}.mem-tag{font-size:10.5px;padding:2px 6px}}
  </style>
</head>
<body>
<main class="app">
  <div class="hero">
    <div class="topbar"><button class="back" id="backBtn" aria-label="返回">‹</button><div class="title" id="pageTitle">小区画像</div><span></span></div>
    <div class="org-card">
      <div class="org-head">
        <div class="avatar" aria-hidden="true" id="avatar"></div>
        <div class="org-main">
          <div class="org-name"><span id="orgName">—</span><span class="chip" id="orgChip">小区</span></div>
          <div class="grid-line" id="orgGrid">归属网格：—</div>
          <div class="tags" id="orgTags"></div>
          <div class="guardian">看管人: <a href="javascript:void(0)" id="guardLink">张明</a><span class="sep">|</span>198****8981<span class="sep">|</span>网格经理</div>
        </div>
      </div>
      <button class="call" id="callBtn" aria-label="拨打电话"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 3.2c.5-.5 1.3-.6 1.9-.2l2.6 1.7c.7.5.9 1.4.5 2.1l-1 1.7c-.2.4-.2.9.1 1.3a15 15 0 0 0 4.1 4.1c.4.3.9.3 1.3.1l1.7-1c.7-.4 1.6-.2 2.1.5l1.7 2.6c.4.6.3 1.4-.2 1.9l-1.5 1.5c-.8.8-2 1.1-3 .7-2.7-1-5.4-2.8-7.8-5.2S5.5 10.4 4.5 7.7c-.4-1-.1-2.2.7-3l1.4-1.5Z"/></svg></button>
    </div>
  </div>

  <div class="body">
    <div class="card"><div class="stats" id="statRow"></div></div>

    <div class="card">
      <div class="card-title">基础信息:</div>
      <div class="basic-rows" id="basicRows"></div>
    </div>

    <div class="card">
      <div class="bar-title">成员信息<span class="cnt" id="memCount"></span></div>
      <div class="mem-chips" id="memChips"></div>
      <div class="mem-list" id="memList"></div>
    </div>

    <div class="card">
      <div class="bar-title">本组织服务</div>
      <div class="svc-grid">
        <button data-svc="走访记录">走访记录</button><button data-svc="成员账单">成员账单</button><button data-svc="工单查询">工单查询</button>
        <button data-svc="宽带资源">宽带资源</button><button data-svc="集团建档">集团建档</button><button data-svc="异动处置">异动处置</button>
      </div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="./kan-data.js"></script>
<script>
(function () {
  var toastEl = document.getElementById('toast');
  var toastTimer;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1900);
  }

  var ICONS = {
    building: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 3.6c0-.9.7-1.6 1.6-1.6h6.8c.9 0 1.6.7 1.6 1.6V21H4V3.6Zm11 -0.4c0-.7.6-1.2 1.3-1.2h3.4c.7 0 1.3.5 1.3 1.2V21h-6V3.2ZM6.6 5.4v2.2h3.2V5.4H6.6Zm0 4.4v2.2h3.2V9.8H6.6Zm0 4.4v2.2h3.2v-2.2H6.6ZM17.4 6.6v2h1.8v-2h-1.8Zm0 4.2v2h1.8v-2h-1.8Z"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3.1c.4 0 .8.1 1.1.4l7.3 6.1c.4.3.6.8.6 1.3v8.5c0 1-.8 1.8-1.8 1.8h-4.1v-6.2H9.9v6.2H5.8c-1 0-1.8-.8-1.8-1.8v-8.5c0-.5.2-1 .6-1.3l7.3-6.1c.3-.3.7-.4 1.1-.4Z"/></svg>',
    group: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 11.2a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2Zm0 1.9c-3.3 0-6 1.9-6 4.2V20h12v-2.7c0-2.3-2.7-4.2-6-4.2Zm7.4-1.9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm.4 1.9c-.7 0-1.3.1-1.9.3 1.4.9 2.4 2.2 2.4 3.8V20H21v-2.4c0-1.9-2-3.5-4.2-3.5Z"/></svg>'
  };

  var TYPE_NAME = { xq: '小区画像', yl: '园楼画像', grp: '集团画像', ji: '家庭画像' };
  var TYPE_TAG = { xq: '小区', yl: '园楼', grp: '集团', ji: '家庭' };
  var TYPE_ICON = { xq: 'building', yl: 'building', grp: 'group', ji: 'home' };

  var current = null;
  var memFilter = '全部';

  function render() {
    if (!current) return;
    var d = current;
    document.getElementById('pageTitle').textContent = TYPE_NAME[d.type] || '组织画像';
    document.getElementById('avatar').innerHTML = ICONS[TYPE_ICON[d.type] || 'building'];
    document.getElementById('orgName').textContent = d.name;
    document.getElementById('orgChip').textContent = d.chip || TYPE_TAG[d.type] || '';
    document.getElementById('orgGrid').textContent = '归属网格：' + d.grid;

    var tags = ['看管人 张明'];
    if (d.type === 'xq') tags.push(d.stats[2][0] === '千兆' ? '千兆小区' : '百兆小区');
    if (d.type === 'yl') tags.push('楼宇建档');
    if (d.type === 'grp') tags.push(d.rows[7][1].indexOf('A类') >= 0 ? 'A类集团' : 'B类集团');
    if (d.type === 'ji') tags.push(d.rows[6][1].indexOf('已办理') >= 0 ? '融合家庭' : '未融合');
    tags.push('服务正常');
    document.getElementById('orgTags').innerHTML = tags.map(function (t) { return '<span>' + t + '</span>'; }).join('');

    document.getElementById('statRow').innerHTML = d.stats.map(function (s) {
      var cls = /^\d/.test(s[0]) ? '' : ' class="txt"';
      return '<div><b' + cls + '>' + s[0] + '</b><small>' + s[1] + '</small><span>' + s[2] + '</span></div>';
    }).join('');

    document.getElementById('basicRows').innerHTML = d.rows.map(function (r) {
      var v = r[1];
      if (d.type === 'grp' && r[0] === '集团分级：') v = '<span class="badge">' + v + '</span>';
      return '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + v + '</span></div>';
    }).join('');

    renderMembers();
  }

  function renderMembers() {
    var d = current;
    if (!d) return;
    var all = d.members || [];
    document.getElementById('memCount').textContent = '（' + all.length + '）';
    var roles = ['全部'];
    all.forEach(function (m) { if (roles.indexOf(m.role) < 0) roles.push(m.role); });
    if (roles.length > 5) roles = roles.slice(0, 5);
    document.getElementById('memChips').innerHTML = roles.map(function (r) {
      return '<button data-role="' + r + '" class="' + (r === memFilter ? 'on' : '') + '">' + r + '</button>';
    }).join('');

    var list = all.filter(function (m) { return memFilter === '全部' || m.role === memFilter; });
    document.getElementById('memList').innerHTML = list.map(function (m, i) {
      var initial = (m.name || '?').slice(0, 1);
      var sub = [m.sub, m.room].filter(Boolean).join(' · ');
      return '<button class="mem" data-i="' + all.indexOf(m) + '">' +
        '<span class="mem-av">' + initial + '</span>' +
        '<span class="mem-main"><span class="mem-name">' + m.name + '<em class="mem-role">' + m.role + '</em></span>' +
        '<span class="mem-sub">' + sub + '</span></span>' +
        '<span class="mem-tag">' + m.tag + '</span></button>';
    }).join('');
    if (!list.length) document.getElementById('memList').innerHTML = '<div style="font-size:13px;color:#98a1ad;padding:18px 0;text-align:center">该分类下暂无成员</div>';
  }

  document.getElementById('memChips').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-role]');
    if (!b) return;
    memFilter = b.getAttribute('data-role');
    renderMembers();
  });

  document.getElementById('memList').addEventListener('click', function (e) {
    var b = e.target.closest('.mem');
    if (!b || !current) return;
    var idx = +b.getAttribute('data-i');
    var m = current.members[idx];
    if (!m) return;
    if (current.type === 'yl') { toast('「' + m.name + '」企业详情（演示）'); return; }
    if (parent && parent !== window) parent.postMessage({ type: 'openMemberProfile', name: m.name, phone: m.sub }, '*');
    else toast('打开 ' + m.name + ' 的客户画像（演示）');
  });

  document.getElementById('backBtn').onclick = function () {
    if (parent && parent !== window) parent.postMessage({ type: 'closeOrgProfile' }, '*');
  };
  document.getElementById('callBtn').onclick = function () {
    toast('正在呼叫看管人 张明（模拟演示）');
  };
  document.getElementById('guardLink').onclick = function () { toast('已查看看管人 张明 的信息'); };
  document.querySelectorAll('[data-svc]').forEach(function (b) {
    b.onclick = function () { toast('打开「' + b.getAttribute('data-svc') + '」（模拟演示）'); };
  });

  window.__setOrg = function (d) {
    if (!d) return;
    current = d;
    memFilter = '全部';
    render();
  };
  window.__orgHook = 'v1';

  /* 独立打开时支持 ?type=xq&name=xxx */
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('type') || 'xq';
    var n = q.get('name') || '';
    if (window.WGT_KAN && n) {
      var d = window.WGT_KAN.orgDetail(t, n);
      if (d) window.__setOrg(d);
    } else if (window.WGT_KAN && !n) {
      var list = window.WGT_KAN.orgs(t);
      if (list.length) window.__setOrg(window.WGT_KAN.orgDetail(t, list[0].name));
    }
  })();
})();
</script>
</body>
</html>
