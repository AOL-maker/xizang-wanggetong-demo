<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>网格通 · 五角色工作台</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <link rel="icon" href="./favicon.ico"/></head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- AI 经营报告（日报 / 周报 / 月报）增强版页面容器 -->
    <div id="reportLayer" style="position:fixed;inset:0;z-index:9999;background:#F2F3F5;display:none;">
      <iframe id="reportFrame" src="about:blank" title="AI 经营报告" style="border:0;width:100%;height:100%;display:block;background:#F2F3F5"></iframe>
    </div>
    <script>
      (function () {
        var layer = document.getElementById('reportLayer');
        var frame = document.getElementById('reportFrame');
        var opened = false;

        function openReport() {
          if (opened) return;
          opened = true;
          frame.src = './report.html';
          layer.style.display = 'block';
          document.body.style.overflow = 'hidden';
        }
        function closeReport() {
          if (!opened) return;
          opened = false;
          layer.style.display = 'none';
          frame.src = 'about:blank';
        }
        window.addEventListener('message', function (e) {
          if (e && e.data && e.data.type === 'closeReport') closeReport();
        });

        function isReportEntry(el) {
          for (var i = 0; i < 4 && el; i++, el = el.parentElement) {
            var t = (el.innerText || '').trim();
            if (t && t.length < 26 && (t.indexOf('AI 日报') >= 0 || t.indexOf('AI日报') >= 0)) return true;
          }
          return false;
        }

        document.addEventListener('click', function (e) {
          if (isReportEntry(e.target)) {
            e.preventDefault();
            e.stopPropagation();
            openReport();
          }
        }, true);

        if (location.hash === '#report') openReport();
        window.__openReport = openReport;
        window.__closeReport = closeReport;
      })();
    </script>
  <script src="./_expo/static/js/web/index-e5486770e6826986028274e1fb05f670.js" defer></script>
</body>
</html>
