    <script>
      /* 个人客户画像入口（内联 v7） */
      (function () {
        var opened = false, layer = null, frame = null;
        var AUTO = location.search.indexOf('auto=1') >= 0;
        /* 当前客户：从客户卡片/客户行解析，注入画像页，保证姓名一致 */
        var currentCustomer = null;
        function parseCustomer(text) {
          if (!text) return null;
          var m = text.match(/^([^\n]{2,10})\n个人\n(1\d{2}\*+\d{4})/);
          if (m) return { name: m[1].trim(), phone: m[2] };
          m = text.match(/([\u4e00-\u9fa5·]{2,6})\s*[|｜\s]\s*(1\d{2}\*+\d{4})/);
          if (m) return { name: m[1].trim(), phone: m[2] };
          return null;
        }
        function pickCustomer(node) {
          var n = node;
          for (var i = 0; i < 8 && n; i += 1, n = n.parentElement) {
            if (!n.innerText) continue;
            var t = (n.innerText || '').trim();
            var c = parseCustomer(t);
            if (c) return c;
            if (t.length > 400) break;
          }
          return scanPageCustomer();
        }
        function scanPageCustomer() {
          var els = document.querySelectorAll('#root div, #root span');
          for (var i = 0; i < els.length; i += 1) {
            var t = (els[i].innerText || '').trim();
            if (!t || t.length > 200) continue;
            var c = parseCustomer(t);
            if (c) return c;
          }
          return null;
        }
        function applyCustomer() {
          if (!frame || !currentCustomer) return;
          try {
            var w = frame.contentWindow;
            if (w && typeof w.__setCustomer === 'function') w.__setCustomer(currentCustomer);
          } catch (e) {}
        }
        function ensureLayer() {
          layer = document.getElementById('customerProfileLayer');
          if (!layer) {
            layer = document.createElement('div');
            layer.id = 'customerProfileLayer';
            layer.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:#fff;display:none;';
            frame = document.createElement('iframe');
            frame.id = 'customerProfileFrame';
            frame.title = '个人客户画像';
            frame.style.cssText = 'border:0;width:100%;height:100%;display:block;background:#f5f7fa;';
            frame.src = 'about:blank';
            frame.addEventListener('load', function () { applyCustomer(); });
            layer.appendChild(frame);
            document.body.appendChild(layer);
          } else {
            frame = document.getElementById('customerProfileFrame') || layer.querySelector('iframe');
          }
        }
        function openProfile() {
          if (opened) return;
          ensureLayer();
          opened = true;
          if (!frame.src || frame.src.indexOf('customer-profile.html') < 0) frame.src = './customer-profile.html?v=7';
          applyCustomer();
          layer.style.display = 'block';
          document.body.style.overflow = 'hidden';
        }
        function closeProfile() {
          if (!opened || !layer) return;
          opened = false;
          layer.style.display = 'none';
          frame.src = 'about:blank';
          document.body.style.overflow = '';
          // 关闭后 500ms 重新预热，保证下次打开依旧秒开
          setTimeout(function () {
            if (!opened && frame && (!frame.src || frame.src.indexOf('customer-profile.html') < 0)) frame.src = './customer-profile.html?v=7';
          }, 500);
        }
        function clickButton(label) {
          var list = Array.prototype.slice.call(document.querySelectorAll('[role="button"],button'));
          for (var i = 0; i < list.length; i += 1) {
            if ((list[i].innerText || '').trim() === label || list[i].getAttribute('aria-label') === label) { list[i].click(); return true; }
          }
          return false;
        }
        window.addEventListener('message', function (e) {
          if (!e || !e.data) return;
          if (e.data.type === 'closeCustomerProfile') { closeProfile(); if (e.data.back) setTimeout(function () { clickButton('返回'); }, 20); }
          if (e.data.type === 'openCustomerService') { closeProfile(); setTimeout(function () { if (!clickButton('为客户办理业务')) clickButton('业务受理'); }, 60); }
        });
        function isAskAi(node) {
          var n = node;
          for (var i = 0; i < 4 && n; i += 1, n = n.parentElement) {
            if (!n.getAttribute) continue;
            if ((n.getAttribute('role') === 'button' || n.tagName === 'BUTTON') && /询问AI|AI灵犀/.test((n.innerText || '').trim())) return true;
          }
          return false;
        }
        function match(node) {
          if (!node || !node.getAttribute) return false;
          var n = node, text;
          for (var i = 0; i < 8 && n; i += 1, n = n.parentElement) {
            if (!n.getAttribute) continue;
            text = (n.innerText || '').trim();
            if (text.indexOf('个人客户画像') >= 0) return false;
            if (/^客户画像/.test(text) && text.length < 400) return !isAskAi(node);
            if (text.length > 400) break;
          }
          // 客户看管「个人」列表里的客户行：点击瞬间就开画像，先于详情页渲染，避免闪一下
          var rowText = (node.innerText || '').trim();
          if (/个人\n1\d{2}\*+\d{4}/.test(rowText) && rowText.length < 200 && rowText.indexOf('客户画像') < 0) return true;
          return false;
        }
        function fire(node) {
          var c = pickCustomer(node);
          if (c) currentCustomer = c;
          setTimeout(openProfile, 30);
        }
        ['click', 'mouseup', 'pointerup', 'touchend'].forEach(function (type) {
          document.addEventListener(type, function (e) { if (match(e.target)) fire(e.target); }, true);
        });
        function bind() {
          var nodes = document.querySelectorAll('#root div, #root span, #root a');
          for (var i = 0; i < nodes.length; i += 1) {
            var el = nodes[i];
            if (el.__cpBound) continue;
            var t = (el.innerText || '').trim();
            if (t === '客户画像' || (/^客户画像\n/.test(t) && t.length < 400)) {
              el.__cpBound = 1;
              (function (node) {
                node.addEventListener('click', function (ev) { if (!isAskAi(ev.target)) fire(ev.target); }, true);
              })(el);
            }
          }
        }
        [600, 1600, 3200].forEach(function (ms) { setTimeout(bind, ms); });
        window.addEventListener('load', bind);
        if (AUTO) {
          setInterval(function () {
            if (opened) return;
            var els = document.querySelectorAll('div');
            for (var i = 0; i < els.length; i += 1) {
              var t = (els[i].innerText || '').trim();
              if (/^客户画像\n所属区域/.test(t) && t.length < 300) {
                if (!els[i].__cpBound) {
                  els[i].__cpBound = 1;
                  (function (node) { node.addEventListener('click', function (ev) { if (!isAskAi(ev.target)) fire(ev.target); }, true); })(els[i]);
                }
                if (!currentCustomer) currentCustomer = scanPageCustomer();
                openProfile();
                return;
              }
            }
          }, 120);
        }
        // 预加载画像页，打开时零等待、无白屏
        setTimeout(function () {
          ensureLayer();
          if (!frame.src || frame.src.indexOf('customer-profile.html') < 0) frame.src = './customer-profile.html?v=7';
        }, 1200);
        window.__openCustomerProfile = openProfile;
        /* 组织画像里的成员下钻：带姓名/手机号打开个人客户画像 */
        window.__openMemberProfile = function (name, phone) {
          if (name || phone) {
            currentCustomer = {
              name: name || (currentCustomer && currentCustomer.name) || '',
              phone: phone || (currentCustomer && currentCustomer.phone) || ''
            };
          }
          openProfile();
        };
        window.__cpHook = 'v8';
      })();
    </script>
