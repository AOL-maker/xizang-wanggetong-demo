<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>如美网格 · 日报</title>
  <style>
    :root{--blue:#0878ee;--blue-soft:#eaf5ff;--page:#e9f3ff;--ink:#25282d;--muted:#6f7782;--line:#e7ebef;--danger:#e74a3b;--orange:#ee9b1f;--green:#16a05d;--radius:16px}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#fff}
    button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
    .app{width:min(600px,100%);min-height:100vh;margin:0 auto;background:#fff}
    .topbar{height:72px;display:grid;grid-template-columns:70px 1fr 100px;align-items:center;padding:0 16px;background:#fff}
    .back{width:44px;height:44px;font-size:28px;color:#8e959d;display:grid;place-items:center}
    .title{text-align:center;font-size:28px;line-height:1.2;font-weight:500;white-space:nowrap}
    .records{justify-self:end;color:#4d80ef;font-size:16px;min-height:44px}
    .filters{height:72px;padding:0 24px;display:grid;grid-template-columns:310px 1fr;align-items:center;gap:16px;background:#fff}
    .segments{height:40px;background:#f5f6f8;border-radius:7px;display:grid;grid-template-columns:repeat(3,1fr);padding:2px}
    .segment{border-radius:6px;color:#777;font-size:16px;min-height:36px}
    .segment.active{background:#fff;color:#333;box-shadow:0 1px 4px rgba(0,0,0,.18)}
    .date-nav{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;text-align:center;font-size:16px;font-weight:700;white-space:nowrap}
    .date-nav button{min-width:36px;min-height:44px;color:#888;font-size:22px}
    .content{background:var(--page);padding:16px;display:flex;flex-direction:column;gap:14px}
    .card{background:#fff;border-radius:var(--radius);padding:16px}
    h2{font-size:21px;line-height:1.35;margin:0 0 8px;font-weight:800}
    .brief h2{color:#d44d3d;font-size:18px}
    .hint{margin:0 0 10px;color:#737b85;font-size:11px;line-height:1.6}
    .priority{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:14px 0}
    .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;margin-top:2px}
    .num.red{background:var(--danger)}.num.orange{background:var(--orange)}.num.blue{background:#4f80e8}
    .priority-title{font-weight:800;font-size:13px;line-height:1.6}.priority-title.danger{color:#d94736}
    .priority-meta,.priority-action{font-size:11px;line-height:1.65;color:#555}
    .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .metric{min-height:88px;border-radius:9px;padding:9px;background:#f6f8fb;border:1px solid #e9edf2}
    .metric.warn{background:#fffaf2;border-color:#f2d7a8}
    .metric-label{font-size:11px;color:#5f6872;margin-bottom:3px;white-space:nowrap}
    .metric-line{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
    .metric-value{font-size:19px;font-weight:800;color:#19365a}.metric-target{font-size:11px;font-weight:500;color:#959ca5}.metric-gap{font-size:9px;font-weight:800;color:#e64b40;white-space:nowrap}.metric-gap.ok{color:var(--green)}
    .track{height:6px;border-radius:4px;background:#e8edf6;overflow:hidden;margin:5px 0}.bar{height:100%;border-radius:4px;background:#6275e8}.warn .bar{background:#e9a126}
    .metric-foot{font-size:10px;color:#5f6872;white-space:nowrap}
    .metric-note{margin:10px 0 0;font-size:10px;line-height:1.6;color:#8a939d;background:#f7f9fc;border-radius:8px;padding:7px 9px}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
    .section-head h2{margin:0}
    .head-meta{font-size:11px;color:#8d949d;white-space:nowrap}
    .collapse{width:34px;height:34px;border-radius:50%;background:#f3f5f8;display:grid;place-items:center;flex:0 0 auto;border:1px solid #e9edf2;transition:background .2s,border-color .2s}
    .collapse:hover{background:#e9eef5;border-color:#dbe3ec}
    .collapse .chev{display:block;width:11px;height:11px;border-left:2.5px solid #7d8590;border-top:2.5px solid #7d8590;border-radius:1.5px;transform:rotate(45deg);transition:transform .28s ease}
    .collapsed .collapse .chev{transform:rotate(225deg)}
    .speech-intro{font-size:11px;color:#737b85;margin:0 0 9px}
    .speech-body{display:flex;flex-direction:column;gap:10px}
    .speech-block{background:#e7f1ff;border-radius:11px;padding:11px;font-size:13px;line-height:1.6}
    .speech-block h3{font-size:13px;color:#5265dc;margin:0 0 6px}.speech-block p{margin:0}.speech-block strong{font-weight:800}
    .edit-area{width:100%;min-height:120px;border:1px solid #bcd6fa;border-radius:9px;padding:10px;font:inherit;line-height:1.6;resize:vertical;color:var(--ink);background:#fff}
    .wide-btn,.pair button{min-height:44px;border-radius:10px;background:#e7f4ff;color:#0072ed;font-size:13px;font-weight:700;display:grid;place-items:center}
    .wide-btn{width:100%;margin-top:10px}.wide-btn.primary{background:#0877da;color:#fff}
    .anomaly{border:1px solid #ffc2ba;background:#fff8f6;border-radius:11px;padding:11px;margin-top:10px}
    .tag{display:inline-flex;align-items:center;min-height:22px;padding:2px 9px;border-radius:5px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;margin-right:8px}.tag.red{background:#ed1430}.tag.blue{background:#1689ee}.tag.orange{background:#ef9f25}.tag.gray{background:#8b95a1}
    .anomaly-title,.task-title{font-size:13px;font-weight:800}.small{font-size:10px;color:#626b74;line-height:1.7;margin:6px 0}.desc{font-size:13px;line-height:1.6;margin:7px 0 9px}
    .pair{display:grid;grid-template-columns:1fr 1fr;gap:38px}.pair.single{grid-template-columns:1fr;gap:0}
    .pair button.white{background:#fff}
    .task{border:1px solid #5fa3ff;background:#e7f2ff;border-radius:11px;padding:11px;margin-top:10px}.task.urgent{border-color:#ffc1b9;background:#fff8f6}
    .quick-link{color:#0878ee;font-size:12px;white-space:nowrap}
    .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
    .quick{min-height:112px;border-radius:11px;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;color:#999}
    .quick strong{font-size:24px;color:#111;margin:6px 0}.quick em{font-style:normal;font-size:15px}.up{color:#79c84b}.down{color:#e55e65}.good{color:#70c54e}.bad{color:#ef6c61}
    /* 走势条 */
    .spark{display:flex;flex-direction:column;gap:7px;margin-top:6px}
    .spark-row{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;gap:8px;font-size:11px;color:#65707c}
    .spark-track{height:13px;border-radius:7px;background:#eff3f9;overflow:hidden}
    .spark-bar{height:100%;border-radius:7px;background:linear-gradient(90deg,#9cc6ff,#3b82f6)}
    .spark-bar.now{background:linear-gradient(90deg,#ffd79f,#ee9b1f)}
    .spark-row em{display:block;font-style:normal;font-size:9px;color:#a3aab3;font-weight:500}
    .spark-row>span:first-child{line-height:1.25}
    .spark-val{text-align:right;font-weight:800;color:#3a4550;font-variant-numeric:tabular-nums;white-space:nowrap}
    /* 对比 */
    .cmp-head,.cmp-row{display:grid;align-items:center;gap:6px;font-size:11px}
    .cmp-head{color:#98a0a9;padding-bottom:7px;border-bottom:1px solid var(--line)}
    .cmp-row{padding:10px 0;border-bottom:1px solid #f2f5f8}
    .cmp-row:last-child{border-bottom:0;padding-bottom:0}
    .cmp-label{font-weight:700;color:#3f4a56;font-size:12px}
    .cmp-sub{font-size:10px;color:#98a0a9;font-weight:500;margin-top:2px}
    .cmp-v{text-align:right;color:#66707c;font-variant-numeric:tabular-nums}
    .cmp-v.cur{font-weight:800;color:#22303f}
    .delta{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;white-space:nowrap}
    .delta.good{color:#128a52;background:#eafaf1}
    .delta.bad{color:#d94736;background:#ffece8}
    .delta.flat{color:#6f7782;background:#f2f4f7}
    /* 排名 */
    .rank-row{display:grid;grid-template-columns:26px 1fr 58px;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #f2f5f8;font-size:12px}
    .rank-row:first-child{border-top:0}
    .rank-no{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;background:#f2f5f9;color:#7b848f}
    .rank-no.t1{background:#ffe9c9;color:#b9740a}.rank-no.t2{background:#e8eefb;color:#4a6bbd}.rank-no.t3{background:#fde6d8;color:#bd6a33}
    .rank-no.low{background:#ffece8;color:#d94736}
    .rank-name{font-weight:700;line-height:1.4}
    .rank-note{font-size:10px;color:#98a0a9;font-weight:500;margin-top:2px}
    .rank-pct{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
    .rank-pct i{font-style:normal;font-size:9px;font-weight:700;color:#a3aab3;margin-left:2px}
    .rank-split{height:1px;background:#eef2f7;margin:6px 0}
    .footer-actions{padding:34px 35px 24px;display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#fff}
    .footer-actions button{min-height:50px;border-radius:11px;background:#e7f4ff;color:#0072ed;font-size:14px;font-weight:700}.footer-actions .submit{background:#0877d8;color:#fff}
    .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:rgba(25,31,40,.9);color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:10;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .subpage{display:none;min-height:100vh;background:#f6f8fb}.subpage.active{display:block}.report-page.hidden{display:none}.sub-head{height:64px;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;background:#fff;padding:0 12px;border-bottom:1px solid #eee}.sub-head h1{text-align:center;font-size:20px;margin:0}.sub-content{padding:16px}.history-row,.team-row{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px}.history-row b,.team-row b{font-size:15px}.history-row p,.team-row p{font-size:12px;color:#707782;margin:6px 0 0}
    .st{float:right;font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px}
    .st.done{color:#128a52;background:#eafaf1}.st.doing{color:#b9740a;background:#fff6e6}
    @media(max-width:520px){.topbar{grid-template-columns:54px 1fr 82px;padding:0 8px}.title{font-size:21px}.records{font-size:14px}.filters{height:112px;padding:8px 16px;grid-template-columns:1fr;gap:4px}.content{padding:10px;gap:10px}.card{padding:13px}.metric-grid{gap:5px}.metric{padding:7px}.metric-label{font-size:10px}.metric-value{font-size:16px}.metric-foot{font-size:9px}.pair{gap:10px}.quick-grid{gap:5px}.quick{padding:5px}.quick strong{font-size:20px}.footer-actions{padding:24px 16px}.priority-title,.desc,.speech-block{font-size:12px}}
  </style>
</head>
<body>
<main class="app">
  <section class="report-page" id="reportPage">
    <header class="topbar"><button class="back" id="backBtn" aria-label="返回">‹</button><div class="title" id="pageTitle">如美网格 · 日报</div><button class="records" data-view="history">报告记录 ›</button></header>
    <div class="filters">
      <div class="segments" role="tablist"><button class="segment active" data-period="day">日报</button><button class="segment" data-period="week">周报</button><button class="segment" data-period="month">月报</button></div>
      <div class="date-nav"><button id="prevDate" aria-label="上一期">‹</button><span id="dateLabel">2026-11-27</span><button id="nextDate" aria-label="下一期">›</button></div>
    </div>
    <div class="content">
      <section class="card brief">
        <h2 id="briefTitle">网格长晨会简报</h2><p class="hint" id="briefHint">同一快照提炼 · 点击可下钻到指标依据或业务明细</p>
        <div id="briefList"></div>
      </section>

      <section class="card"><h2 id="metricTitle">整体经营情况</h2><div class="metric-grid" id="metricGrid"></div><p class="metric-note" id="metricNote" hidden></p></section>

      <section class="card" id="trendCard" hidden>
        <div class="section-head"><h2 id="trendTitle">走势</h2><span class="head-meta" id="trendMeta"></span></div>
        <div class="spark" id="trendBody"></div>
      </section>

      <section class="card" id="cmpCard" hidden>
        <div class="section-head"><h2 id="cmpTitle">对比</h2><span class="head-meta" id="cmpMeta"></span></div>
        <div id="cmpBody" style="margin-top:8px"></div>
      </section>

      <section class="card" id="speechCard">
        <div class="section-head"><h2 id="speechTitle">AI 晨会发言框架</h2><button class="collapse" id="speechToggle" aria-label="收起AI晨会发言框架"><i class="chev"></i></button></div>
        <p class="speech-intro" id="speechIntro">完成情况、主要问题、工作安排均引用当前报告快照，点击编辑可调整。</p>
        <div class="speech-body" id="speechBody"></div>
        <button class="wide-btn" id="editSpeech">编辑</button>
      </section>

      <section class="card"><h2 id="anomalyTitle">AI识别异常指标</h2><div id="anomalies"></div><button class="wide-btn" id="moreAnomaly" data-toast="已展开全部6项异常">查看全部6项异常</button></section>

      <section class="card"><h2 id="taskTitle">团队未完成事项及重点工作</h2><div id="tasks"></div></section>

      <section class="card"><div class="section-head"><h2 id="quickTitle">团队快速一览</h2><button class="quick-link" data-view="team">→ 点击切换到团队日报看完整汇总</button></div><div class="quick-grid" id="quickGrid"></div></section>

      <section class="card" id="rankCard" hidden>
        <div class="section-head"><h2 id="rankTitle">团队排名</h2><span class="head-meta" id="rankMeta"></span></div>
        <div id="rankBody" style="margin-top:6px"></div>
      </section>
    </div>
    <div class="footer-actions"><button class="submit" data-toast="报告已提交">提交报告</button><button id="exportReport">导出报告文本</button></div>
  </section>

  <section class="subpage" id="historyPage"><header class="sub-head"><button data-back-sub>‹</button><h1>报告记录</h1><span></span></header><div class="sub-content" id="historyList"></div></section>
  <section class="subpage" id="teamPage"><header class="sub-head"><button data-back-sub>‹</button><h1 id="teamPageTitle">团队日报完整汇总</h1><span></span></header><div class="sub-content" id="teamList"></div></section>
</main>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   数据层：日报 / 周报 / 月报三套快照，口径与数量互相咬合
   - 日报：11/27 当日 vs 日目标
   - 周报：第 48 周（11/23–11/29）累计 vs 阶段目标（日目标 × 已过 5 天）
   - 月报：11 月累计 vs 阶段目标（日目标 × 已过 27 天）
   宽带新增：日均 26 户 × 5 天 = 周累计 130；月累计 756（W1 190 + W2 196 + W3 222 + W4 148）
   ============================================================ */
const DAY = {
  briefTitle: '网格长晨会简报',
  briefHint: '同一快照提炼 · 点击可下钻到指标依据或业务明细',
  priorities: [
    { cls: 'red', danger: true, title: '指标缺口 · 宽带新增距目标差8', meta: '已完成24/32，完成率75%，时间进度100%', action: '核实宽带新增缺口对象与原因，明确当日推进安排' },
    { cls: 'orange', danger: false, title: '指标缺口 · 5G套包达成率距目标差4', meta: '已完成8/12，完成率67%，时间进度100%', action: '核实5G套包达成率缺口对象与原因，明确当日推进安排' },
    { cls: 'blue', danger: false, title: '指标缺口 · 宽带保有率距目标差6.6', meta: '已完成78.4/85，完成率92%，时间进度100%', action: '核实宽带保有率缺口对象与原因，明确当日推进安排' }
  ],
  metricTitle: '整体经营情况',
  metricNote: '',
  foot: p => p + ' % · 时间进度 100 %',
  metrics: [
    ['收入完成率', '86', '100', '差14', 86, false, true],
    ['宽带新增', '24', '32', '缺8', 75, true, false],
    ['融合保有率', '96', '95', '达标', 100, false, true],
    ['5G套包达成率', '8', '12', '缺4', 67, true, false],
    ['客户份额', '52.1', '52', '达标', 100, false, true],
    ['宽带保有率', '78.4', '85', '缺6.6', 92, true, false],
    ['日必达达成率', '78', '100', '缺22', 78, true, false],
    ['综合考核得分', '44.6', '60', '缺15.4', 74, true, false],
    ['攻坚日均新增', '68', '81', '缺13', 84, true, false]
  ],
  trend: null,
  cmp: null,
  rank: null,
  speechTitle: 'AI 晨会发言框架',
  speechIntro: '完成情况、主要问题、工作安排均引用当前报告快照，点击编辑可调整。',
  speech: [
    ['一、完成情况', '昨天团队收入完成率86%，融合保有率101%，客户份额100%，这两项达标表现不错。\n但不少指标拖了后腿：宽带新增只完成75%，差了8户；5G套包达成率67%，缺口4户；宽带保有率92%，还差6.6个点；日必达、综合考核、攻坚日均新增都存在不同程度差距。\n这里重点说下人员差距—王小明120%领跑全队，但李四只有65%，比团队均值低了17个百分点，主要差在宽带新增和商机转化上。目前还有28笔欠费催收待分派、3件异常待处理。'],
    ['二、主要问题', '三件事要盯死：第一，宽带新增、5G套包、宽带保有率三大核心指标缺口大，当日必须拿出推进动作补缺口；第二，重点事项闭环风险高，28笔欠费催收今天必须分派到10名网格经理，张三那张SLA工单明天12点前要闭环，刘总集团商机已经停滞7天没进展；第三，团队两极分化明显，李四短板突出，再不跟进会拖整体进度。'],
    ['三、工作安排', '1. 指标攻坚：梳理宽带新增、5G套包、宽带保有缺口客户，现场落实责任人；单独对齐李四，找准卡点、评估帮扶资源。\n2. 风险清收：优先处置逾期工单与任务，补齐 4 份订单资料；保障 SLA 投诉工单按时闭环，避免考核超时。\n3. 重点事项：完成 28 笔欠费催收分派；确定刘总商机对接人，启动区县协同；补齐缺失拜访记录。\n4. 标杆带动：安排王小明准备宽带转化经验，后续团队内分享。']
  ],
  anomalyTitle: 'AI识别异常指标',
  anomalies: [
    { tag: '高风险', title: '指标缺口 · 宽带新增距目标差8', meta: '已完成24/32，完成率75%，时间进度100%', action: '核实宽带新增缺口对象与原因，明确当日推进安排' },
    { tag: '高风险', title: '指标缺口 · 5G套包达成率距目标差4', meta: '已完成8/12，完成率67%，时间进度100%', action: '核实5G套包达成率缺口对象与原因，明确当日推进安排' },
    { tag: '高风险', title: '指标缺口 · 宽带保有率距目标差6.6', meta: '已完成78.4/85，完成率92%，时间进度100%', action: '核实宽带保有率缺口对象与原因，明确当日推进安排' }
  ],
  anomalyMore: '查看全部6项异常',
  anomalyTotal: 6,
  taskTitle: '团队未完成事项及重点工作',

const DATA = { day: DAY, week: WEEK, month: MONTH };

/* 工作台「AI 日报 / 周报 / 月报」卡片三宫格数据
   —— 由父页面 home-report-card.js 读取，保证卡片数字与本报告口径完全一致 */
window.__WGT_CARD_STATS = (function () {
  const PRE = { day: '今日', week: '本周', month: '本月' };
  function pack(d, p) {
    const lag = (d.metrics || []).filter(m => m[5] === true).length;
    const anom = d.anomalyTotal || (d.anomalies || []).length;
    return [
      { v: String(anom), l: PRE[p] + '需关注异常' },
      { v: String(lag), l: PRE[p] + '目标进度落后' },
      { v: String((d.priorities || []).length), l: PRE[p] + '重点事项' }
    ];
  }
  /* 每次读取都按当前 DATA 重算 */
  return function () {
    return { day: pack(DAY, 'day'), week: pack(WEEK, 'week'), month: pack(MONTH, 'month') };
  };
})();
const PERIOD_TITLE = { day: '日报', week: '周报', month: '月报' };
const TEAM_PAGE_TITLE = { day: '团队日报完整汇总', week: '团队周报完整汇总', month: '团队月报完整汇总' };

/* ---------- 渲染 ---------- */
function renderBrief(d) {
  document.getElementById('briefTitle').textContent = d.briefTitle;
  document.getElementById('briefHint').textContent = d.briefHint;
  document.getElementById('briefList').innerHTML = d.priorities.map((p, i) => `
    <div class="priority"><span class="num ${p.cls}">${i + 1}</span><div>
      <div class="priority-title ${p.danger ? 'danger' : ''}">${p.title}</div>
      <div class="priority-meta">${p.meta}</div>
      <div class="priority-action">${p.action}</div>
    </div></div>`).join('');
}

function renderMetrics(d) {
  document.getElementById('metricTitle').textContent = d.metricTitle;
  document.getElementById('metricGrid').innerHTML = d.metrics.map(m => `
    <div class="metric ${m[5] ? 'warn' : ''}">
      <div class="metric-label">${m[0]}</div>
      <div class="metric-line"><span class="metric-value">${m[1]}<span class="metric-target">/${m[2]}</span></span><span class="metric-gap ${m[6] ? 'ok' : ''}">${m[3]}</span></div>
      <div class="track"><div class="bar" style="width:${Math.min(m[4], 100)}%"></div></div>
      <div class="metric-foot">${d.foot(m[4])}</div>
    </div>`).join('');
  const note = document.getElementById('metricNote');
  if (d.metricNote) { note.hidden = false; note.textContent = d.metricNote; } else { note.hidden = true; note.textContent = ''; }
}

function renderTrend(d) {
  const card = document.getElementById('trendCard');
  if (!d.trend) { card.hidden = true; return; }
  card.hidden = false;
  document.getElementById('trendTitle').textContent = d.trend.title;
  document.getElementById('trendMeta').textContent = d.trend.meta;
  const max = Math.max.apply(null, d.trend.rows.map(r => r[1]));
  document.getElementById('trendBody').innerHTML = d.trend.rows.map((r, i) => {
    const now = d.trend.highlightLast && i === d.trend.rows.length - 1;
    return `<div class="spark-row"><span>${r[0]}${r[2] ? '<em>' + r[2] + '</em>' : ''}</span>
      <div class="spark-track"><div class="spark-bar ${now ? 'now' : ''}" style="width:${Math.round(r[1] / max * 100)}%"></div></div>
      <span class="spark-val">${r[1]} ${d.trend.unit}</span></div>`;
  }).join('');
}

function renderCmp(d) {
  const card = document.getElementById('cmpCard');
  if (!d.cmp) { card.hidden = true; return; }
  card.hidden = false;
  document.getElementById('cmpTitle').textContent = d.cmp.title;
  document.getElementById('cmpMeta').textContent = d.cmp.meta;
  const cols = d.cmp.cols;
  const tpl = `grid-template-columns:1fr repeat(${cols.length},62px)`;
  const head = `<div class="cmp-head" style="${tpl}"><span>指标</span>${cols.map((c, i) => `<span class="cmp-v" style="text-align:right">${c}</span>`).join('')}</div>`;
  const rows = d.cmp.rows.map(r => `
    <div class="cmp-row" style="${tpl}">
      <div><div class="cmp-label">${r.label}</div><div class="cmp-sub">${r.sub} · <span class="delta ${r.kind}">${r.delta}</span></div></div>
      ${r.vals.map((v, i) => `<span class="cmp-v ${i === 0 ? 'cur' : ''}" style="text-align:right">${v}</span>`).join('')}
    </div>`).join('');
  document.getElementById('cmpBody').innerHTML = head + rows;
}

function renderSpeech(d) {
  document.getElementById('speechTitle').textContent = d.speechTitle;
  document.getElementById('speechIntro').textContent = d.speechIntro;
  renderSpeechBody(false);
}
const speechCache = {};
function currentSpeech() {
  const d = DATA[period];
  if (!speechCache[period]) speechCache[period] = d.speech.map(x => [x[0], x[1]]);
  return speechCache[period];
}
function renderSpeechBody(edit) {
  const speech = currentSpeech();
  document.getElementById('speechBody').innerHTML = speech.map((s, i) => `
    <div class="speech-block"><h3>${s[0]}</h3>${edit
      ? `<textarea class="edit-area" data-speech="${i}">${s[1]}</textarea>`
      : `<p>${s[1].replaceAll('\n', '<br>')}</p>`}</div>`).join('');
}

function renderAnomalies(d) {
  document.getElementById('anomalyTitle').textContent = d.anomalyTitle;
  document.getElementById('anomalies').innerHTML = d.anomalies.map(a => `
    <div class="anomaly"><div><span class="tag ${a.tag === '高风险' ? '' : (a.tag === '风险' || a.tag === '趋势异常' ? 'orange' : 'blue')}">${a.tag}</span><span class="anomaly-title">${a.title}</span></div>
      <div class="small">${a.meta}</div><div class="desc">${a.action}</div>
      <div class="pair"><button data-toast="已发起攻坚">发起攻坚</button><button class="white" data-toast="已打开指标明细">查看明细</button></div>
    </div>`).join('');
  const btn = document.getElementById('moreAnomaly');
  btn.textContent = d.anomalyMore;
  btn.dataset.toast = '已展开' + (d.anomalyTotal || d.anomalies.length) + '项异常';
}

function renderTasks(d) {
  document.getElementById('taskTitle').textContent = d.taskTitle;
  document.getElementById('tasks').innerHTML = d.tasks.map(t => `
    <div class="task ${t.urgent ? 'urgent' : ''}"><div><span class="tag ${t.tagClass}">${t.tag}</span><span class="task-title">${t.title}</span></div>
      <div class="desc">${t.desc}</div>
      <div class="pair ${t.buttons.length === 1 ? 'single' : ''}">${t.buttons.map((b, i) => `<button class="${i ? 'white' : ''}" data-toast="${b}操作已记录">${b}</button>`).join('')}</div>
    </div>`).join('');
}

function renderQuick(d) {
  document.getElementById('quickTitle').textContent = d.quickTitle;
  document.querySelector('.quick-link').textContent = d.teamLink;
  document.getElementById('quickGrid').innerHTML = d.quick.map(q => `
    <div class="quick">${q[0]}<strong>${q[1]}</strong><em class="${q[3]}">${q[2]}</em></div>`).join('');
}

function renderRank(d) {
  const card = document.getElementById('rankCard');
  if (!d.rank) { card.hidden = true; return; }
  card.hidden = false;
  document.getElementById('rankTitle').textContent = d.rank.title;
  document.getElementById('rankMeta').textContent = d.rank.meta;
  const rows = d.rank.rows;
  document.getElementById('rankBody').innerHTML = rows.map((r, i) => {
    const cls = i === 0 ? 't1' : i === 1 ? 't2' : i === 2 ? 't3' : (i >= rows.length - 2 ? 'low' : '');
    return `<div class="rank-row"><span class="rank-no ${cls}">${i + 1}</span>
      <div><div class="rank-name">${r[0]}</div><div class="rank-note">${r[2]}</div></div>
      <span class="rank-pct">${r[1]}<i>%</i></span></div>`;
  }).join('');
}

function renderSubs(d) {
  document.getElementById('historyList').innerHTML = d.history.map(h => `
    <div class="history-row"><span class="st ${h[2]}">${h[2] === 'done' ? '已提交' : '生成中'}</span><b>${h[0]}</b><p>${h[1]}</p></div>`).join('');
  document.getElementById('teamPageTitle').textContent = TEAM_PAGE_TITLE[period];
  document.getElementById('teamList').innerHTML = d.team.map(t => `
    <div class="team-row"><b>${t[0]}</b><p>${t[1]}</p></div>`).join('');
}

/* ---------- 周期切换 ---------- */
const toast = document.getElementById('toast'); let toastTimer;
function showToast(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800); }
document.addEventListener('click', e => { const el = e.target.closest('[data-toast]'); if (el) showToast(el.dataset.toast); });

let period = 'day';
let date = new Date(2026, 10, 27);
function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` }
function isoWeek(dt) { const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate())); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3); const first = new Date(Date.UTC(d.getUTCFullYear(), 0, 4)); const fd = (first.getUTCDay() + 6) % 7; first.setUTCDate(first.getUTCDate() - fd + 3); return { year: d.getUTCFullYear(), week: 1 + Math.round((d - first) / 6048e5) } }
function weekRange(d) {
  const s = new Date(d); const day = (s.getDay() + 6) % 7; s.setDate(s.getDate() - day);
  const e = new Date(s); e.setDate(s.getDate() + 6);
  return { start: s, end: e, text: `${s.getMonth() + 1}/${s.getDate()}–${e.getMonth() + 1}/${e.getDate()}` };
}
function periodLabel() {
  if (period === 'day') return fmtDate(date);
  if (period === 'week') return `${isoWeek(date).year}年第${isoWeek(date).week}周 · ${weekRange(date).text}`;
  return `${date.getFullYear()}年${date.getMonth() + 1}月`;
}

function renderAll() {
  const d = DATA[period];
  document.querySelectorAll('[data-period]').forEach(b => b.classList.toggle('active', b.dataset.period === period));
  document.getElementById('dateLabel').textContent = periodLabel();
  document.getElementById('pageTitle').textContent = `如美网格 · ${PERIOD_TITLE[period]}`;
  document.title = `如美网格 · ${PERIOD_TITLE[period]}`;
  renderBrief(d); renderMetrics(d); renderTrend(d); renderCmp(d);
  renderSpeech(d); renderAnomalies(d); renderTasks(d); renderQuick(d); renderRank(d); renderSubs(d);
  editing = false;
  document.getElementById('editSpeech').textContent = '编辑';
  document.getElementById('speechBody').style.display = 'flex';
  document.getElementById('editSpeech').style.display = 'grid';
  document.getElementById('speechCard').classList.remove('collapsed');
  try { if (parent && parent !== window) parent.postMessage({ type: 'wgtReportStats' }, '*'); } catch (e) {}
}

function setDate(step) {
  if (period === 'day') date.setDate(date.getDate() + step);
  else if (period === 'week') date.setDate(date.getDate() + step * 7);
  else date.setMonth(date.getMonth() + step);
  renderAll();
}
document.getElementById('prevDate').onclick = () => setDate(-1);
document.getElementById('nextDate').onclick = () => setDate(1);
document.querySelectorAll('[data-period]').forEach(btn => btn.onclick = () => { period = btn.dataset.period; renderAll(); });

/* ---------- 发言框架 ---------- */
document.getElementById('speechToggle').onclick = () => {
  const card = document.getElementById('speechCard');
  card.classList.toggle('collapsed');
  const off = card.classList.contains('collapsed');
  document.getElementById('speechBody').style.display = off ? 'none' : 'flex';
  document.getElementById('editSpeech').style.display = off ? 'none' : 'grid';
};
let editing = false;
document.getElementById('editSpeech').onclick = e => {
  if (editing) {
    document.querySelectorAll('[data-speech]').forEach(x => { currentSpeech()[+x.dataset.speech][1] = x.value; });
    editing = false; renderSpeechBody(false); e.target.textContent = '编辑'; showToast('发言框架已保存');
  } else {
    editing = true; renderSpeechBody(true); e.target.textContent = '保存';
  }
};

/* ---------- 子页 / 返回 / 导出 ---------- */
function openView(name) { document.getElementById('reportPage').classList.add('hidden'); document.getElementById(name + 'Page').classList.add('active'); scrollTo(0, 0) }
function closeView() { document.querySelectorAll('.subpage').forEach(x => x.classList.remove('active')); document.getElementById('reportPage').classList.remove('hidden'); scrollTo(0, 0) }
document.querySelectorAll('[data-view]').forEach(x => x.onclick = () => openView(x.dataset.view));
document.querySelectorAll('[data-back-sub]').forEach(x => x.onclick = closeView);
document.getElementById('backBtn').onclick = () => parent.postMessage({ type: 'closeLeaderReport', back: true }, '*');
document.getElementById('exportReport').onclick = () => {
  const d = DATA[period];
  const text = [`如美网格 · ${PERIOD_TITLE[period]}`, periodLabel(), d.briefTitle,
    ...d.priorities.map(p => p.title + '｜' + p.meta + '｜' + p.action),
    ...d.metrics.map(m => `${m[0]} ${m[1]}/${m[2]} ${m[3]}`),
    ...currentSpeech().map(x => x[0] + '\n' + x[1])].join('\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = `如美网格${PERIOD_TITLE[period]}_${periodLabel().replace(/[ ·]/g, '_')}.txt`;
  a.click(); URL.revokeObjectURL(a.href); showToast('报告文本已导出');
};

renderAll();
</script>
