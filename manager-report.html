<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>张明 · 日报</title>
  <style>
    :root{--blue:#0878ee;--blue-soft:#eaf5ff;--page:#e9f3ff;--ink:#25282d;--muted:#6f7782;--line:#e7ebef;--danger:#e74a3b;--orange:#ee9b1f;--green:#16a05d;--radius:16px}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#fff}
    button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
    .app{width:min(600px,100%);min-height:100vh;margin:0 auto;background:#fff}
    /* 顶栏：与网格长日报完全一致 */
    .topbar{height:72px;display:grid;grid-template-columns:70px 1fr 100px;align-items:center;padding:0 16px;background:#fff}
    .back{width:44px;height:44px;font-size:28px;color:#8e959d;display:grid;place-items:center}
    .title{text-align:center;font-size:28px;line-height:1.2;font-weight:500;white-space:nowrap}
    .records{justify-self:end;color:#4d80ef;font-size:16px;min-height:44px}
    .filters{height:72px;padding:0 24px;display:grid;grid-template-columns:310px 1fr;align-items:center;gap:16px;background:#fff}
    .segments{height:40px;background:#f5f6f8;border-radius:7px;display:grid;grid-template-columns:repeat(3,1fr);padding:2px}
    .segment{border-radius:6px;color:#777;font-size:16px;min-height:36px}
    .segment.active{background:#fff;color:#333;box-shadow:0 1px 4px rgba(0,0,0,.18)}
    .date-nav{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;text-align:center;font-size:16px;font-weight:700;white-space:nowrap}
    .date-nav button{min-width:36px;min-height:44px;color:#888;font-size:22px}
    .content{background:var(--page);padding:16px;display:flex;flex-direction:column;gap:14px}
    .card{background:#fff;border-radius:var(--radius);padding:16px}
    h2{font-size:21px;line-height:1.35;margin:0 0 8px;font-weight:800}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;margin-bottom:6px}
    .section-head h2{margin:0}
    .head-meta{font-size:11px;color:#8d949d;white-space:nowrap}
    .head-count{font-size:12px;color:#8d949d;white-space:nowrap}
    /* 重点任务 */
    .priority{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
    .priority:first-of-type{border-top:0}
    .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;margin-top:2px}
    .num.red{background:var(--danger)}.num.orange{background:var(--orange)}.num.blue{background:#4f80e8}
    .priority-title{font-weight:800;font-size:14px;line-height:1.6}
    .priority-meta{font-size:11px;line-height:1.65;color:#6a727c;margin-top:3px}
    .pill{font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;white-space:nowrap;margin-top:2px}
    .pill.p0{color:#e0432f;background:#ffece8;border:1px solid #ffc9bf}
    .pill.sla{color:#d9820d;background:#fff6e6;border:1px solid #f7dfae}
    .pill.high{color:#0d6fdd;background:#e9f3ff;border:1px solid #c7e0ff}
    /* 关键数据 */
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
    .stat-item{background:#f6f8fb;border:1px solid #e9edf2;border-radius:10px;padding:9px 6px;text-align:center}
    .stat-item b{display:block;font-size:16px;font-weight:800;color:#19365a;line-height:1.3}
    .stat-item span{font-size:10px;color:#7b838d;white-space:nowrap}
    .sum-note{margin:10px 0 0;font-size:11px;line-height:1.7;color:#5f6a76;background:#f7f9fc;border-radius:9px;padding:9px 11px}
    .sum-note b{color:#2f3944}
    /* 考核进度 */
    .kpi{display:grid;grid-template-columns:74px 1fr 44px;align-items:center;gap:10px;padding:7px 0}
    .kpi-label{font-size:12px;color:#4c545e;white-space:nowrap}
    .kpi-track{height:12px;border-radius:6px;background:#eef2f7;overflow:hidden}
    .kpi-bar{height:100%;border-radius:6px;background:#3b82f6}
    .kpi-val{font-size:12px;font-weight:700;text-align:right;color:#3a4550;font-variant-numeric:tabular-nums}
    .ai-tip{margin-top:12px;border:1px solid #f5cf9a;background:#fff9ef;border-radius:12px;padding:12px;font-size:12px;line-height:1.7;color:#5a4a33}
    .ai-tip b{color:#3d3222}
    .ai-tip .lnk{color:#0d6fdd;font-weight:700}
    /* 待办 */
    .hint{margin:0 0 10px;color:#7b838d;font-size:11px;line-height:1.6}
    .hint .lnk{color:#0d6fdd;font-weight:700;margin-left:6px;cursor:pointer}
    .todo{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
    .todo:first-of-type{border-top:0}
    .box{width:20px;height:20px;border-radius:6px;border:1.6px solid #c3ccd8;display:grid;place-items:center;background:#fff;transition:.15s}
    .box i{width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
    .todo.done .box{background:#1f8ff0;border-color:#1f8ff0}
    .todo.done .box i{opacity:1}
    .todo-title{font-size:13.5px;font-weight:600;line-height:1.5}
    .todo.done .todo-title{color:#8b939d;font-weight:500}
    .todo-meta{font-size:11px;color:#8b939d;margin-top:2px}
    .todo.done .todo-meta{color:#aab1ba}
    .todo-right{display:flex;align-items:center;gap:8px}
    .chip{font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px;white-space:nowrap}
    .chip.key{color:#d9820d;background:#fff6e6;border:1px solid #f7dfae}
    .chip.sla{color:#e0432f;background:#ffece8;border:1px solid #ffc9bf}
    .fb{font-size:11.5px;font-weight:700;color:#0d6fdd;background:#eaf3ff;border-radius:7px;padding:6px 11px;white-space:nowrap}
    .note{margin:12px 0 0;font-size:11px;color:#7b838d;line-height:1.6;background:#f6f8fb;border-radius:9px;padding:9px 11px}
    /* 计划（只读） */
    .plan-row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
    .plan-row:first-of-type{border-top:0}
    .plan-tag{font-size:10px;font-weight:800;text-align:center;padding:4px 0;border-radius:6px}
    .plan-tag.carry{color:#0d6fdd;background:#eaf3ff;border:1px solid #c7e0ff}
    .plan-tag.add{color:#18a05e;background:#eafaf1;border:1px solid #bfe9d4}
    .plan-text{font-size:13px;font-weight:600;line-height:1.5}
    .plan-text em{font-style:normal;color:#8b939d;font-weight:500;font-size:11.5px}
    .adjust{font-size:11.5px;font-weight:700;color:#69737f;background:#f2f4f7;border-radius:7px;padding:6px 11px}
    .plan-saved{margin:12px 0 0;font-size:11px;color:#128a52;background:#eafaf1;border-radius:8px;padding:8px 10px;line-height:1.5}
    /* 计划卡内的三个操作按钮（编辑 / 手动添加 / 保存计划） */
    .plan-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px;padding-top:14px;border-top:1px solid #f0f3f7}
    .plan-actions[hidden]{display:none}
    .plan-actions button{min-height:42px;border-radius:10px;background:#f4f5f7;color:#5a6370;font-size:12.5px;font-weight:700;transition:background .15s}
    .plan-actions button:active{background:#e8ebf0}
    .plan-actions #btnSavePlan{background:#eef5ff;color:#0d6fdd}
    /* 计划（编辑） */
    .ed-sec{margin-top:14px}
    .ed-sec:first-child{margin-top:4px}
    .ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;color:#3a4550;margin-bottom:4px}
    .ed-head small{font-weight:600;color:#98a0a9;font-size:10.5px}
    .ed-toggle{font-size:10.5px;font-weight:700;color:#0d6fdd;background:#eef5ff;border-radius:6px;padding:4px 8px}
    .ed-item{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:start;padding:9px 0;border-top:1px solid #f2f5f8;font-size:12.5px;line-height:1.5;cursor:pointer}
    .ed-item:first-of-type{border-top:0}
    .cbx{width:20px;height:20px;border-radius:6px;border:1.6px solid #c3ccd8;background:#fff;display:grid;place-items:center;margin-top:1px;flex:0 0 auto}
    .cbx i{width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
    .ed-item.on .cbx{background:#1f8ff0;border-color:#1f8ff0}
    .ed-item.on .cbx i{opacity:1}
    .ed-item.off{cursor:default;color:#aab1ba}
    .ed-item.off .cbx{background:#f4f6f9;border-color:#e0e6ee;border-style:dashed}
    .ed-tagline{font-size:10px;color:#98a0a9;margin-top:2px;font-weight:500}
    .ed-add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:6px}
    .ed-input{width:100%;min-height:42px;border:1px solid #d5dee9;border-radius:9px;padding:0 11px;font:inherit;font-size:12.5px;color:#25282d;background:#fff}
    .ed-input::placeholder{color:#a9b1bb}
    .ed-input:focus{outline:none;border-color:#8eb8f5;box-shadow:0 0 0 2px #e8f2ff}
    .ed-add button{min-height:42px;padding:0 15px;border-radius:9px;background:#0877d8;color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap}
    .pe-row{display:grid;grid-template-columns:46px 1fr 34px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #f2f5f8}
    .pe-row:first-of-type{border-top:0}
    .pe-row input{min-height:38px;border:1px solid #e2e8f0;border-radius:8px;padding:0 10px;font:inherit;font-size:12.5px;background:#fbfcfe;color:#25282d;width:100%}
    .pe-row input:focus{outline:none;border-color:#8eb8f5;background:#fff}
    .del{width:32px;height:32px;border-radius:8px;background:#fff1f0;color:#d94736;font-size:14px;font-weight:800;display:grid;place-items:center}
    .ed-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
    .ed-actions button{min-height:44px;border-radius:10px;font-size:13px;font-weight:700}
    .ed-actions .ghost{background:#f4f5f7;color:#5a6370}
    .ed-actions .primary{background:#0877d8;color:#fff}
    .ed-empty{font-size:11.5px;color:#a9b1bb;padding:9px 0}
    /* 底部 */
    .footer-actions{padding:22px 24px 28px;background:#fff;display:grid;gap:12px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .footer-actions button{min-height:46px;border-radius:11px;background:#e7f4ff;color:#0072ed;font-size:13.5px;font-weight:700}
    .footer-actions .submit{background:#0877d8;color:#fff;min-height:50px;font-size:14px}
    .footer-actions .ghost{background:#f4f5f7;color:#5a6370}
    .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:rgba(25,31,40,.9);color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:10;white-space:nowrap;max-width:88vw}.toast.show{opacity:1;transform:translate(-50%,0)}
    .subpage{display:none;min-height:100vh;background:#f6f8fb}.subpage.active{display:block}.report-page.hidden{display:none}
    .sub-head{height:64px;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;background:#fff;padding:0 12px;border-bottom:1px solid #eee}.sub-head h1{text-align:center;font-size:20px;margin:0}.sub-content{padding:16px}
    .history-row{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px}.history-row b{font-size:15px}.history-row p{font-size:12px;color:#707782;margin:6px 0 0}
    .st{float:right;font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px}
    .st.done{color:#128a52;background:#eafaf1}.st.doing{color:#b9740a;background:#fff6e6}
    @media(max-width:520px){
      .topbar{grid-template-columns:54px 1fr 82px;padding:0 8px}.title{font-size:21px}.records{font-size:14px}
      .filters{height:112px;padding:8px 16px;grid-template-columns:1fr;gap:4px}
      .content{padding:10px;gap:10px}.card{padding:13px}
      .kpi{grid-template-columns:64px 1fr 40px;gap:8px}
      .footer-actions{padding:18px 16px 24px}
      .priority{grid-template-columns:26px 1fr auto;gap:8px}
      .num{width:26px;height:26px;font-size:12px}
      .priority-title,.todo-title,.plan-text{font-size:12.5px}
      .stat-item b{font-size:14px}
    }
  </style>
</head>
<body>
<main class="app">
  <section class="report-page" id="reportPage">
    <header class="topbar"><button class="back" id="backBtn" aria-label="返回">‹</button><div class="title" id="pageTitle">张明 · 日报</div><button class="records" data-view="history">报告记录 ›</button></header>
    <div class="filters">
      <div class="segments" role="tablist"><button class="segment active" data-period="day">日报</button><button class="segment" data-period="week">周报</button><button class="segment" data-period="month">月报</button></div>
      <div class="date-nav"><button id="prevDate" aria-label="上一期">‹</button><span id="dateLabel">2026-11-17</span><button id="nextDate" aria-label="下一期">›</button></div>
    </div>
    <div class="content">
      <section class="card">
        <h2 id="keyTitle">今日重点任务 · 3 项</h2>
        <div id="keyList"></div>
      </section>

      <section class="card">
        <div class="section-head"><h2 id="statTitle">本期关键数据</h2><span class="head-meta" id="statMeta"></span></div>
        <div class="stat-grid" id="statGrid"></div>
        <p class="sum-note" id="statNote" hidden></p>
      </section>

      <section class="card">
        <div class="section-head"><h2>个人考核完成进度</h2><span class="head-meta" id="kpiMeta">截止 11/17 · 月度进度 57%</span></div>
        <div id="kpiList"></div>
        <div class="ai-tip" id="aiTip"></div>
      </section>

      <section class="card">
        <div class="section-head"><h2 id="todoTitle">今日待办 · 重点任务</h2><span class="head-count" id="todoCount">5/10 项</span></div>
        <p class="hint" id="draftHint">日报草稿 17:50 已自动生成 · 数据来自任务/拜访/商机/工单<span class="lnk" data-toast="打开日报草稿">查看</span></p>
        <div id="todoList"></div>
        <p class="note" id="todoNote">勾选后：完成数 5→6 · 进度条 · 日报【今日完成】段落同步更新</p>
      </section>

      <section class="card" id="planCard">
        <div class="section-head"><h2 id="planTitle">AI 明日计划</h2><span class="head-count" id="planCount"></span></div>
        <p class="hint" id="planHint"></p>
        <div id="planBody"></div>
        <p class="plan-saved" id="planSaved" hidden></p>
        <div class="plan-actions" id="planActions">
          <button class="ghost" id="btnEdit">编辑</button>
          <button class="ghost" id="btnAddManual">手动添加</button>
          <button class="ghost" id="btnSavePlan">保存计划</button>
        </div>
      </section>
    </div>
    <div class="footer-actions">
      <div class="row2">
        <button data-toast="打开日报草稿编辑">编辑日报草稿</button>
        <button class="submit" data-toast="日报已提交">确认提交</button>
      </div>
    </div>
  </section>

  <section class="subpage" id="historyPage">
    <header class="sub-head"><button data-back-sub>‹</button><h1>报告记录</h1><span></span></header>
    <div class="sub-content" id="historyList"></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   数据层：日报 / 周报 / 月报各一套，口径互相对得上
   - 日报：11/17 当日，宽带 3/4、5G 1/2、拜访 5 次
   - 周报：第 47 周（11/16–11/22）截至 11/17，宽带 9/12、5G 3/4、拜访 18 次
   - 月报：11 月截至 11/17，宽带 31/60、5G 18/36、拜访 96 次
   ============================================================ */
const DAY = {
  keyTitle: '今日重点任务 · 3 项',
  priorities: [
    { cls: 'red', title: '宽带新增缺口 8 单', meta: '完成率低于网格均值 23% · 团队宽带整体缺口 128 户', pill: 'P0 紧急', pillCls: 'p0' },
    { cls: 'orange', title: '投诉工单 3 个今日响应', meta: '12:00 前必须完成首次响应 · 团队 3 张 SLA 投诉分派给我', pill: 'SLA', pillCls: 'sla' },
    { cls: 'blue', title: '刘总集团商机停滞 7 天', meta: '网格长今日协同推进 · 建议今日跟进 · 目标 3 万收入', pill: '高价值', pillCls: 'high' }
  ],
  statTitle: '本期关键数据',
  statMeta: '今日 · 数据来自任务/拜访/商机/工单',
  stats: [['3/4', '宽带新增'], ['1/2', '5G 套包'], ['5 次', '拜访'], ['1 个', '商机成交']],
  kpiMeta: '截止 11/17 · 月度进度 57%',
  kpi: [['收入', 94], ['客户规模', 65], ['业务发展', 40], ['社区融合', 50], ['集团客户', 100], ['渠道拓展', 60]],
  aiTip: '<b>AI 提醒</b><br>客户规模 65%、业务发展 40% 双落后，建议下午集中跑<span class="lnk">金阳花园片区</span>，重点挖潜宽带 + 5G 套餐（团队 SKU 仅 2-3%，是最大缺口）',
  todoTitle: '今日待办 · 重点任务',
  draftHint: '日报草稿 17:50 已自动生成 · 数据来自任务/拜访/商机/工单',
  todoNoteSeg: '日报【今日完成】',
  todos: [
    { t: '拜访小区物业洽谈宽带团购', m: '成交 3 户', done: true },
    { t: '投诉回访 2 件', m: '已闭环', done: true },
    { t: '金阳花园 5 户宽带安装', m: '已完成', done: true },
    { t: '晨会点名 · 今日目标确认', m: '已完成', done: true },
    { t: '网格区域巡检 2 个小区', m: '已完成', done: true },
    { t: '李老板续签谈判', m: '', chip: '重点', chipCls: 'key', done: false },
    { t: '工单 #C2081 上门处理', m: '', chip: 'SLA 18:00', chipCls: 'sla', done: false },
    { t: '商机补录：餐饮连锁需求', m: '', done: false },
    { t: '欠费催缴：扎西 1280 元逾期 7 天', m: '', done: false },
    { t: '客户建档：金阳花园 3 户未建档', m: '', done: false }
  ],
  planTitle: 'AI 明日计划',
  target: '明日',
  suggest: ['晨会指派：陪同拜访刘总集团', 'AI 推荐：3 户宽带临期回访（金阳花园）'],
  history: [
    ['张明 · 日报', '2026-11-17 · 已提交', 'done'],
    ['张明 · 日报', '2026-11-16 · 已提交', 'done'],
    ['张明 · 周报', '2026年第47周 · 生成中（截至 11/17）', 'doing'],
    ['张明 · 周报', '2026年第46周（11/9–11/15）· 已提交', 'done'],
    ['张明 · 月报', '2026年11月 · 生成中（截至 11/17）', 'doing'],
    ['张明 · 月报', '2026年10月 · 已提交', 'done']
  ]
};

const WEEK = {
  keyTitle: '本周重点任务 · 3 项',
  priorities: [

window.__WGT_CARD_STATS = (function () {
  const PRE = { day: '今日', week: '本周', month: '本月' };
  function pack(d, p) {
    const total = d.todos.length;
    const done = d.todos.filter(t => t.done).length;
    const left = total - done;
    const pct = total ? Math.round(done / total * 100) : 0;
    return [
      { v: String(done), l: PRE[p] + '有效完成' },
      { v: pct + '%', l: PRE[p] + '计划进度' },
      { v: String(left), l: PRE[p] + '待跟进事项' }
    ];
  }
  /* 每次读取都按当前 DATA 重算（待办勾选会改 done），保证卡片与报告实时一致 */
  return function () {
    return { day: pack(DAY, 'day'), week: pack(WEEK, 'week'), month: pack(MONTH, 'month') };
  };
})();

/* ---------- 工具 ---------- */
const toast = document.getElementById('toast'); let toastTimer;
function showToast(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800); }
function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` }
function isoWeek(dt) { const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate())); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3); const first = new Date(Date.UTC(d.getUTCFullYear(), 0, 4)); const fd = (first.getUTCDay() + 6) % 7; first.setUTCDate(first.getUTCDate() - fd + 3); return { year: d.getUTCFullYear(), week: 1 + Math.round((d - first) / 6048e5) } }
function weekRange(d) {
  const s = new Date(d); const day = (s.getDay() + 6) % 7; s.setDate(s.getDate() - day);
  const e = new Date(s); e.setDate(s.getDate() + 6);
  return `${s.getMonth() + 1}/${s.getDate()}–${e.getMonth() + 1}/${e.getDate()}`;
}
function periodLabel() {
  if (period === 'day') return fmtDate(date);
  if (period === 'week') return `${isoWeek(date).year}年第${isoWeek(date).week}周 · ${weekRange(date)}`;
  return `${date.getFullYear()}年${date.getMonth() + 1}月`;
}
function hhmm() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') }

const STORE_KEY = 'wgtManagerPlanV1';
function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { return {}; } }
function saveStore(o) { try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); } catch (e) {} }
let savedMap = loadStore();
function planKey() {
  if (period === 'day') return 'day:' + fmtDate(date);
  if (period === 'week') { const w = isoWeek(date); return 'week:' + w.year + '-W' + w.week; }
  return 'month:' + date.getFullYear() + '-' + (date.getMonth() + 1);
}
function defaultPlan() {
  const items = [];
  DATA[period].todos.forEach((t, i) => { if (!t.done) items.push({ id: 'c' + i, ti: i, src: 'carry', text: t.t }); });
  DATA[period].suggest.forEach((s, i) => items.push({ id: 'a' + i, src: 'add', text: s }));
  return items;
}
function currentItems() {
  const rec = savedMap[planKey()];
  if (rec && rec.items && rec.items.length) return rec.items;
  return defaultPlan();
}

function renderPlanRead() {
  const items = currentItems();
  planMeta(items);
  const actions = document.getElementById('planActions');
  if (actions) actions.hidden = false;
  document.getElementById('planBody').innerHTML = items.length
    ? items.map((it, i) => `<div class="plan-row">

  } else { savedEl.hidden = true; savedEl.textContent = ''; }
}

function renderEditor(focusIdx) {
  const d = DATA[period];
  const todos = d.todos;
  const undone = todos.map((t, i) => ({ t, i })).filter(x => !x.t.done);
  const done = todos.map((t, i) => ({ t, i })).filter(x => x.t.done);
  const carrySet = draft.filter(x => x.src === 'carry').map(x => x.ti);

  const undoHTML = undone.length ? undone.map(({ t, i }) => `
    <div class="ed-item ${carrySet.indexOf(i) >= 0 ? 'on' : ''}" data-carry="${i}">
      <span class="cbx"><i></i></span>
      <div>${t.t}${t.chip ? `<div class="ed-tagline">${t.chip}</div>` : ''}</div>
    </div>`).join('') : '<div class="ed-empty">本期无未完成任务</div>';

  const doneHTML = done.length ? done.map(({ t }) => `
    <div class="ed-item off"><span class="cbx"></span>
      <div>${t.t}<div class="ed-tagline">已完成 · 不带入${d.target}计划</div></div>
    </div>`).join('') : '<div class="ed-empty">本期无已完成任务</div>';

  const listHTML = draft.length ? draft.map((it, i) => `
    <div class="pe-row">
      <span class="plan-tag ${it.src}">${it.src === 'carry' ? '顺延' : '新增'}</span>
      <input data-text="${i}" value="${it.text.replace(/"/g, '&quot;')}" placeholder="填写${d.target}安排">
      <button class="del" data-del="${i}" aria-label="删除">×</button>
    </div>`).join('') : '<div class="ed-empty">勾选未完成任务或新增安排后，计划清单会出现在这里</div>';

  document.getElementById('planBody').innerHTML = `
    <div class="ed-sec">
      <div class="ed-head"><span>未完成任务</span><small>${undone.length} 项可带入 · 勾选后进入${d.target}计划</small></div>
      ${undoHTML}
    </div>
    <div class="ed-sec">
      <div class="ed-head"><span>已完成任务</span><small>${done.length} 项已自动排除</small><button class="ed-toggle" id="edDoneToggle">${doneOpen ? '收起' : '查看'}</button></div>
      <div ${doneOpen ? '' : 'hidden'}>${doneHTML}</div>
    </div>
    <div class="ed-sec">
      <div class="ed-head"><span>新增安排</span><small>支持手动补充${d.target}工作</small></div>
      <div class="ed-add">
        <input class="ed-input" id="edInput" placeholder="例如：回访幸福里 3 户宽带临期客户">
        <button id="edAddBtn">添加</button>
      </div>
    </div>
    <div class="ed-sec">
      <div class="ed-head"><span>${d.target}计划清单</span><small>可直接修改文字 · 共 ${draft.length} 项</small></div>
      ${listHTML}
    </div>
    <div class="ed-actions">
      <button class="ghost" id="edCancel">取消</button>
      <button class="primary" id="edSave">保存计划</button>
    </div>`;
  document.getElementById('planSaved').hidden = true;
  const actions = document.getElementById('planActions');
  if (actions) actions.hidden = true;

  if (focusIdx !== undefined && focusIdx >= 0) {
    const inp = document.querySelector(`[data-text="${focusIdx}"]`);
    if (inp) { inp.focus(); inp.select(); }
  }
}

function enterEdit(focusIdx, inputFocus) {
  if (!editing) draft = currentItems().map(x => Object.assign({}, x));
  editing = true;
  doneOpen = false;
  renderEditor(focusIdx);
  const card = document.getElementById('planCard');
  if (card.scrollIntoView) card.scrollIntoView({ block: 'start' });
  if (inputFocus) { const i = document.getElementById('edInput'); if (i) i.focus(); }
}

function toggleCarry(ti) {
  const idx = draft.findIndex(x => x.src === 'carry' && x.ti === ti);
  if (idx >= 0) draft.splice(idx, 1);
  else draft.push({ id: 'c' + ti, ti: ti, src: 'carry', text: DATA[period].todos[ti].t });
  renderEditor();
}

function addDraft() {
  const inp = document.getElementById('edInput');
  const text = (inp.value || '').trim();
  if (!text) { showToast('请先输入安排内容'); inp.focus(); return; }
  draft.push({ id: 'a' + Date.now(), src: 'add', text: text });
  renderEditor();
  const again = document.getElementById('edInput');
  if (again) again.focus();
  showToast('已添加 1 项新增安排');
}

function commitSave() {
  const empty = draft.filter(x => !x.text.trim());
  if (empty.length) { showToast(`有 ${empty.length} 项内容为空，请先填写`); return; }
  if (!draft.length) { showToast('请至少保留 1 项计划'); return; }
  savedMap[planKey()] = { items: draft.map(x => Object.assign({}, x)), savedAt: hhmm(), label: periodLabel() };
  saveStore(savedMap);
  editing = false;
  const d = DATA[period];
  renderPlanRead();
  showToast(`计划已保存 · ${d.target}共 ${draft.length} 项`);
  notifyParent();
}

const planBody = document.getElementById('planBody');
planCard.addEventListener('click', e => {
  const carry = e.target.closest('[data-carry]');
  if (carry) { toggleCarry(+carry.dataset.carry); return; }
  if (e.target.closest('#edDoneToggle')) { doneOpen = !doneOpen; renderEditor(); return; }
  if (e.target.closest('#edAddBtn')) { addDraft(); return; }
  const del = e.target.closest('[data-del]');
  if (del) { draft.splice(+del.dataset.del, 1); renderEditor(); return; }
  if (e.target.closest('#edCancel')) { editing = false; renderPlanRead(); return; }
  if (e.target.closest('#edSave')) { commitSave(); return; }
  if (e.target.closest('#btnEdit')) { enterEdit(); return; }
  const adj = e.target.closest('[data-adjust]');
  if (adj) { enterEdit(+adj.dataset.adjust); return; }
});
planCard.addEventListener('input', e => {
  const inp = e.target.closest('[data-text]');
  if (inp) { draft[+inp.dataset.text].text = inp.value; }
});
planCard.addEventListener('keydown', e => {
  if (e.target.id === 'edInput' && e.key === 'Enter') { e.preventDefault(); addDraft(); }
});

/* ---------- 周期切换 ---------- */
function renderPeriod() {
  document.querySelectorAll('[data-period]').forEach(b => b.classList.toggle('active', b.dataset.period === period));
  document.getElementById('dateLabel').textContent = periodLabel();
  document.getElementById('pageTitle').textContent = `张明 · ${PERIOD_TITLE[period]}`;
  document.title = `张明 · ${PERIOD_TITLE[period]}`;
  editing = false;
  draft = [];
  doneOpen = false;
  renderKeys(); renderStats(); renderKpi(); renderTodos();
  renderPlan();
  document.getElementById('historyList').innerHTML = DATA[period].history.map(h => `
    <div class="history-row"><span class="st ${h[2]}">${h[2] === 'done' ? '已提交' : '生成中'}</span><b>${h[0]}</b><p>${h[1]}</p></div>`).join('');
  notifyParent();
}
function setDate(step) {
  if (period === 'day') date.setDate(date.getDate() + step);
  else if (period === 'week') date.setDate(date.getDate() + step * 7);
  else date.setMonth(date.getMonth() + step);
  renderPeriod();
}
document.getElementById('prevDate').onclick = () => setDate(-1);
document.getElementById('nextDate').onclick = () => setDate(1);
document.querySelectorAll('[data-period]').forEach(btn => btn.onclick = () => { period = btn.dataset.period; renderPeriod(); });

/* 计划卡内的三个按钮接上真实操作 */
document.getElementById('btnEdit').onclick = () => enterEdit();
document.getElementById('btnAddManual').onclick = () => enterEdit(-1, true);
document.getElementById('btnSavePlan').onclick = () => {
  if (editing) { commitSave(); return; }
  savedMap[planKey()] = { items: currentItems().map(x => Object.assign({}, x)), savedAt: hhmm(), label: periodLabel() };
  saveStore(savedMap);
  renderPlanRead();
  showToast(`计划已保存 · 共 ${currentItems().length} 项`);
};

/* 待办勾选 */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-toast]');
  if (el) { showToast(el.dataset.toast); return; }
  const row = e.target.closest('.todo');
  if (row && !e.target.closest('.fb')) {
    const i = +row.dataset.i;
    DATA[period].todos[i].done = !DATA[period].todos[i].done;
    renderTodos();
    /* 未勾选的待办集合变了 → 若计划尚未保存，同步刷新默认计划 */
    if (!savedMap[planKey()] && !editing) renderPlan();
    showToast(DATA[period].todos[i].done ? '已标记完成 · 日报同步更新' : '已取消完成标记');
  }
});

/* 子页 / 返回 */
function openView(name) { document.getElementById('reportPage').classList.add('hidden'); document.getElementById(name + 'Page').classList.add('active'); scrollTo(0, 0) }
function closeView() { document.querySelectorAll('.subpage').forEach(x => x.classList.remove('active')); document.getElementById('reportPage').classList.remove('hidden'); scrollTo(0, 0) }
document.querySelectorAll('[data-view]').forEach(x => x.onclick = () => openView(x.dataset.view));
document.querySelectorAll('[data-back-sub]').forEach(x => x.onclick = closeView);
document.getElementById('backBtn').onclick = () => parent.postMessage({ type: 'closeManagerReport', back: true }, '*');

renderPeriod();
</script>
</body>
</html>
